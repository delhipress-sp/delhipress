<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Confirm details</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#212121;font-family:Inter,Mukta,Arial,sans-serif}
.page{max-width:700px;margin:0 auto;min-height:100vh;padding-bottom:135px}
.top{height:72px;display:flex;align-items:center;padding:0 22px;border-bottom:0;background:#fff}
.back{border:0;background:none;font-size:34px;line-height:1;padding:0 12px 4px 0;cursor:pointer;color:#111}
.title{font-size:22px;font-weight:500}
.steps{height:105px;display:flex;position:relative;padding:15px 35px 0;background:#fff;box-shadow:0 5px 13px rgba(0,0,0,.12)}
.step{width:33.333%;text-align:center;position:relative;color:#aaa;font-size:16px}
.step:before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:#e7e7e7;z-index:0}
.step:first-child:before{display:none}
.circle{width:40px;height:40px;border-radius:50%;margin:0 auto 8px;background:#fff;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;position:relative;z-index:1}
.step.done,.step.active{color:#222}
.step.done .circle{border-color:#2874f0;color:#2874f0}
.step.active{font-weight:700}
.step.active .circle{background:#2874f0;border-color:#2874f0;color:#fff}
.content{padding:30px 28px 20px}
.heading{font-size:27px;font-weight:800;margin:0 0 26px}
.address-card{background:#f5f5f5;border-radius:25px;padding:27px 28px;margin-bottom:34px}
.address-top{display:flex;align-items:center;gap:10px}
.pin{font-size:25px}
.name{font-size:24px;font-weight:800;flex:1}
.change{color:#0878df;font-size:20px;font-weight:800;border:0;background:none;cursor:pointer}
.address-text{font-size:18px;line-height:1.45;margin-top:22px}
.phone{font-size:18px;color:#555;margin-top:17px}
.divider{height:1px;background:#e6e6e6;margin:28px 0}
.coin{border:1px solid #e8e8e8;border-radius:20px;padding:17px 20px;display:flex;gap:15px;align-items:center;color:#999}
.coin-icon{width:42px;height:42px;border-radius:12px;background:#fff4c9;display:flex;align-items:center;justify-content:center;font-size:23px}
.coin-title{font-size:19px;font-weight:700}.coin-sub{font-size:14px;margin-top:2px}
.product{display:flex;gap:20px;margin:40px 0 20px;align-items:flex-start}
.product-img{width:175px;height:175px;object-fit:cover;border-radius:3px;background:#eee}
.product-info{flex:1;min-width:0}
.product-name{font-size:21px;line-height:1.25;margin-bottom:12px}
.qty{color:#666;font-size:16px;margin-bottom:12px}
.total{font-size:24px;font-weight:800}
.delivery,.openbox{background:#f5f5f5;border-radius:15px;padding:17px 20px;margin-top:15px;font-size:17px}
.delivery b,.openbox b{font-weight:800}
.save{position:fixed;left:0;right:0;bottom:82px;background:#d9f8e8;color:#00894f;text-align:center;padding:10px;font-size:17px;z-index:10}
.bottom{position:fixed;left:0;right:0;bottom:0;height:82px;background:#fff;border-top:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:10px 28px;z-index:11;box-shadow:0 -3px 10px rgba(0,0,0,.05)}
.amount-old{font-size:17px;color:#777;text-decoration:line-through}
.amount{font-size:27px;font-weight:800;margin-top:2px}
.continue{height:56px;min-width:320px;border:0;border-radius:17px;background:#ffd600;font-size:22px;font-weight:800;cursor:pointer}
@media(max-width:600px){
 .page{width:100%;padding-bottom:130px}
 .top{height:68px;padding:0 18px}.title{font-size:21px}
 .steps{height:106px;padding:14px 25px 0}.step{font-size:15px}.circle{width:39px;height:39px}
 .content{padding:29px 28px 20px}.heading{font-size:26px}
 .address-card{padding:27px 27px;border-radius:24px}.name{font-size:23px}.change{font-size:19px}
 .address-text{font-size:17px}.phone{font-size:17px}
 .product{gap:20px}.product-img{width:173px;height:173px}.product-name{font-size:20px}
 .continue{min-width:47%;font-size:20px}.bottom{padding:10px 18px}.save{font-size:16px}
}
@media(max-width:430px){
 .content{padding-left:28px;padding-right:28px}
 .product-img{width:150px;height:150px}.product-name{font-size:18px}
 .continue{min-width:47%;height:54px}.amount{font-size:24px}
 .address-card{padding:24px}.name{font-size:21px}.change{font-size:17px}
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <button class="back" onclick="location.href='address.html'" aria-label="Back">←</button>
    <div class="title">Confirm details</div>
  </div>

  <div class="steps">
    <div class="step done">
      <div class="circle">✓</div>
      Address
    </div>
    <div class="step active">
      <div class="circle">2</div>
      Confirm details
    </div>
    <div class="step">
      <div class="circle">3</div>
      Payment
    </div>
  </div>

  <main class="content">
    <h1 class="heading">Delivering to</h1>

    <section class="address-card">
      <div class="address-top">
        <span class="pin">📍</span>
        <span class="name" id="name">—</span>
        <button class="change" onclick="location.href='address.html'">Change</button>
      </div>
      <div class="address-text" id="address">—</div>
      <div class="phone">⌕ <span id="mobile">—</span></div>
    </section>

    <div class="divider"></div>

    <div class="coin">
      <div class="coin-icon">⚡</div>
      <div>
        <div class="coin-title">Pay using SuperCoins</div>
        <div class="coin-sub">Available balance: 0</div>
      </div>
    </div>

    <section class="product">
      <img id="productImg" class="product-img" alt="Product">
      <div class="product-info">
        <div class="product-name" id="productName">Order item</div>
        <div class="qty">Quantity: <b id="qty">1</b></div>
        <div class="total" id="productTotal">₹0</div>
      </div>
    </section>
    <div class="delivery" style="color:#111;">🖨️ &nbsp; <b>कार्ड प्रिंट होते ही सूचना दिया जाएगा</b></div>
    <div class="openbox">▱ &nbsp; <b>Order delivery will be done</b> ›</div>

    <div class="divider"></div>
  </main>
</div>

<div class="save" id="saveText">Your order details are ready to confirm</div>
<div class="bottom">
  <div>
    <div class="amount-old" id="oldAmount"></div>
    <div class="amount" id="amount">₹0</div>
  </div>
  <button class="continue" onclick="goPayment()">Continue</button>
</div>

<script>
let order={}; let address={};
try{order=JSON.parse(localStorage.getItem('dp_temp_order')||'{}')||{}}catch(e){}
try{address=JSON.parse(localStorage.getItem('dp_delivery_address')||'{}')||{}}catch(e){}
const pick=(...v)=>v.find(x=>String(x||'').trim())||'';
const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');

const name=pick(address.fullName,order.customer_name,order.name);
const mobile=pick(address.mobile,order.mobile,order.phone);
const fullAddress=pick(address.address,order.address,order.delivery_address);
const gpsParts=[address.post,address.police,address.district,address.state,address.pincode].filter(Boolean).join(', ');
const area=[address.post,address.police,address.district,address.state,address.pincode].filter(Boolean).join(', ');

document.getElementById('name').textContent=name||'—';
document.getElementById('mobile').textContent=mobile||'—';
document.getElementById('address').textContent=[fullAddress,gpsParts].filter(Boolean).join(', ')||'—';

const img=pick(order.card_image,order.image,order.product_image);
const imgEl=document.getElementById('productImg');
if(img){imgEl.src=img}else{imgEl.style.visibility='hidden'}

document.getElementById('productName').textContent=pick(order.card_name,order.card_title,order.orderTitle,order.product_name)||'Order item';
const qty=Number(order.quantity||order.qty||1);
document.getElementById('qty').textContent=qty;

const total=Number(order.total_amount||order.calculatedGrandTotal||order.grand_total||order.amount||0);
document.getElementById('productTotal').textContent=money(total);
document.getElementById('amount').textContent=money(total);

const advance=Number(order.advance_paid||0);
const balance=Number(order.balance_amount||0);
if(balance>0 && total>0) document.getElementById('saveText').textContent='Advance '+money(advance)+' • Balance '+money(balance);
else document.getElementById('saveText').textContent='Order total '+money(total);


function goPayment(){
  if(!name || !mobile || !fullAddress){
    location.href='address.html'; return;
  }
  location.href='payment.html';
}
</script>
</body>
</html>
