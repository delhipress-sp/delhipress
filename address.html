<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Address - दिल्ली प्रेस</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Mukta','Poppins',sans-serif;background:#f5f5f5;color:#222;min-height:100vh;padding-bottom:82px}
.header{background:#fff;padding:15px 18px;border-bottom:1px solid #e5e5e5;position:sticky;top:0;z-index:10}
.header-row{display:flex;align-items:center;gap:15px}
.back{border:0;background:none;font-size:23px;cursor:pointer;color:#222;width:35px;height:35px}
.header h1{font-family:Poppins,sans-serif;font-size:22px;font-weight:500}
.steps{background:#fff;display:flex;align-items:flex-start;justify-content:center;padding:8px 8px 16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.step{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:#888;min-width:82px}
.circle{width:38px;height:38px;border-radius:50%;border:2px solid #ddd;display:grid;place-items:center;font-weight:700}
.step.done{color:#333}.step.done .circle{border-color:#2874f0;color:#2874f0}
.step.active{color:#111;font-weight:800}.step.active .circle{background:#2874f0;border-color:#2874f0;color:#fff}
.line{height:2px;background:#e5e5e5;width:55px;margin-top:18px}
.wrap{max-width:650px;margin:22px auto;padding:0 14px}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.title{font-family:Poppins,sans-serif;font-size:25px;font-weight:800;margin-bottom:5px}
.sub{color:#777;font-size:14px;margin-bottom:20px}
.group{margin-bottom:15px}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input,textarea,select{width:100%;border:1px solid #d5d5d5;border-radius:8px;padding:12px 13px;font-family:inherit;font-size:15px;outline:none;background:#fff}
textarea{min-height:95px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:#2874f0;box-shadow:0 0 0 3px rgba(40,116,240,.10)}
.row{display:flex;gap:12px}.row .group{flex:1}
.save{width:100%;height:50px;border:0;border-radius:8px;background:#2874f0;color:#fff;font-size:17px;font-weight:800;cursor:pointer;margin-top:6px}
.save:active{transform:scale(.99)}
.note{background:#f8f8f8;border-radius:8px;padding:10px 12px;color:#666;font-size:12px;margin-top:12px}
@media(max-width:600px){.row{display:block}.card{padding:17px}.wrap{padding:0 10px}.title{font-size:23px}}
</style>
</head>
<body>

<header class="header">
  <div class="header-row">
    <button class="back" onclick="history.back()" aria-label="वापस"><i class="fa-solid fa-arrow-left"></i></button>
    <h1>Address</h1>
  </div>
</header>

<div class="steps">
  <div class="step active"><span class="circle">1</span><span>Address</span></div>
  <div class="line"></div>
  <div class="step"><span class="circle">2</span><span>Confirm details</span></div>
  <div class="line"></div>
  <div class="step"><span class="circle">3</span><span>Payment</span></div>
</div>

<main class="wrap">
  <section class="card">
    <h2 class="title">Delivering to</h2>
    <p class="sub">ऑर्डर भेजने के लिए अपना सही नाम, पता और मोबाइल नंबर भरें।</p>

    <form id="addressForm">
      <div class="group">
        <label for="customerName">पूरा नाम *</label>
        <input id="customerName" type="text" placeholder="Name" required>
      </div>

      <div class="group">
        <label for="mobile">मोबाइल नंबर *</label>
        <input id="mobile" type="tel" inputmode="numeric" maxlength="10" placeholder="10 अंकों का मोबाइल नंबर" required>
      </div>

      <div class="group">
        <label for="address">पूरा पता *</label>
        <textarea id="address" placeholder="मकान/दुकान, रोड, मोहल्ला, गाँव आदि पूरा पता लिखें" required></textarea>
      </div>

      <div class="row">
        <div class="group">
          <label for="post">पोस्ट</label>
          <input id="post" type="text" placeholder="पोस्ट">
        </div>
        <div class="group">
          <label for="police">थाना</label>
          <input id="police" type="text" placeholder="थाना">
        </div>
      </div>

      <div class="row">
        <div class="group">
          <label for="password">Password *</label>
          <input id="password" type="password" minlength="6" placeholder="कम से कम 6 अक्षर" autocomplete="new-password" required>
        </div>
        <div class="group">
          <label for="confirmPassword">Confirm Password *</label>
          <input id="confirmPassword" type="password" minlength="6" placeholder="Password दोबारा लिखें" autocomplete="new-password" required>
        </div>
      </div>

      <div class="row">
        <div class="group">
          <label for="district">जिला *</label>
          <input id="district" type="text" placeholder="जिला" required>
        </div>
        <div class="group">
          <label for="state">राज्य *</label>
          <input id="state" type="text" value="Jharkhand" required>
        </div>
        <div class="group">
          <label for="pincode">PIN Code *</label>
          <input id="pincode" type="tel" inputmode="numeric" maxlength="6" placeholder="815352" required>
        </div>
      </div>

      <button class="save" type="submit">
        <i class="fa-solid fa-arrow-right"></i> Continue
      </button>

      <div class="note">
        <i class="fa-solid fa-lock"></i>
        आपकी दी गई जानकारी इसी ऑर्डर की डिलीवरी और ऑर्डर रिकॉर्ड के लिए उपयोग होगी।
      </div>
    </form>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  const form=document.getElementById('addressForm');

  // पहले से सेव address हो तो form में दिखाएँ।
  let old={};
  try{old=JSON.parse(localStorage.getItem('dp_delivery_address')||'{}')||{};}catch(e){}

  const ids=['customerName','mobile','address','post','police','district','state','pincode'];
  ids.forEach(id=>{
    const el=document.getElementById(id);
    if(el && old[id]) el.value=old[id];
  });

  form.addEventListener('submit',function(e){
    e.preventDefault();

    const data={};
    ids.forEach(id=>data[id]=document.getElementById(id).value.trim());

    if(!/^\d{10}$/.test(data.mobile)){
      alert('कृपया सही 10 अंकों का मोबाइल नंबर डालें।');
      document.getElementById('mobile').focus();
      return;
    }
    if(!/^\d{6}$/.test(data.pincode)){
      alert('कृपया सही 6 अंकों का PIN Code डालें।');
      document.getElementById('pincode').focus();
      return;
    }

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    if(password.length < 6){
      alert('Password कम से कम 6 अक्षरों का होना चाहिए।');
      document.getElementById('password').focus();
      return;
    }
    if(password !== confirmPassword){
      alert('Password और Confirm Password एक जैसा होना चाहिए।');
      document.getElementById('confirmPassword').focus();
      return;
    }

    // Address को अलग से सेव करें।
    localStorage.setItem('dp_delivery_address',JSON.stringify(data));

    // अगर ग्राहक पहले से login नहीं है, तो इसी Address Details के Submit पर
    // बिना OTP/अलग Login screen के उसका account अपने-आप बनाकर local login कर दें।
    // पहले उसी mobile का existing account देखें; मिलने पर उसी account को login मानें।
    (async function autoCreateOrRestoreLogin(){
      try{
        const SUPABASE_URL = "https://qsvhtfkrlzclnqwypfdy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdmh0ZmtybHpjbG5xd3lwZmR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDc3NjMsImV4cCI6MjEwMzgyMzc2M30.HLYUjfCK0w9d6C_-uPMFv-eAe6Cd_YkueSo--iHOUys";
        if(!window.supabase || !window.supabase.createClient) throw new Error('Supabase library unavailable');
        const client = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

        let current={};
        try{ current=JSON.parse(localStorage.getItem('dp_current_user')||localStorage.getItem('dp_logged_in_user')||localStorage.getItem('user')||'{}')||{}; }catch(e){}
        const loggedMobile=String(current.mobile||current.phone||'').replace(/\D/g,'');
        if(loggedMobile.length>=10) return;

        const mobile=data.mobile;
        let existing=null;
        for(const variant of [...new Set([mobile,'91'+mobile,'+91'+mobile])]){
          const {data:row,error}=await client.from('users').select('*').eq('mobile',variant).maybeSingle();
          if(!error && row){ existing=row; break; }
        }

        let user=existing;
        if(!user){
          const autoEmail=(mobile+'@carddelhipress.in').toLowerCase();
          const autoPass='DP'+mobile.slice(-6);
          const {data:created,error}=await client.from('users').insert([{
            email:autoEmail, mobile:mobile, name:data.customerName,
            village:data.post||'', address:[data.address,data.post?'पोस्ट: '+data.post:'',data.police?'थाना: '+data.police:'',data.district?'जिला: '+data.district:'',data.state,data.pincode?'PIN: '+data.pincode:''].filter(Boolean).join(', '),
            pass:password
          }]).select('*').maybeSingle();
          if(error){
            // Mobile may already exist in another format; retry lookup once.
            for(const variant of [...new Set([mobile,'91'+mobile,'+91'+mobile])]){
              const {data:row}=await client.from('users').select('*').eq('mobile',variant).maybeSingle();
              if(row){ user=row; break; }
            }
          }else{ user=created; }
        }

        if(user){
          const localUser={
            name:user.name||data.customerName||'', email:user.email||'', mobile:user.mobile||mobile,
            village:user.village||data.post||'', address:user.address||data.address||''
          };
          const json=JSON.stringify(localUser);
          localStorage.setItem('dp_current_user',json);
          localStorage.setItem('dp_logged_in_user',json);
          localStorage.setItem('user',json);
        }
      }catch(err){
        console.warn('Auto signup/login skipped:',err);
      }
    })().finally(function(){
      // मौजूदा order data में भी customer details जोड़ दें।
      continueAfterAutoAccount();
    });
    return;

    function continueAfterAutoAccount(){
    try{
      const raw=localStorage.getItem('dp_temp_order');
      if(raw){
        const order=JSON.parse(raw);
        order.customer_name=data.customerName;
        order.name=data.customerName;
        order.mobile=data.mobile;
        order.phone=data.mobile;
        order.address=[
          data.address,
          data.post ? 'पोस्ट: '+data.post : '',
          data.police ? 'थाना: '+data.police : '',
          data.district ? 'जिला: '+data.district : '',
          data.state,
          data.pincode ? 'PIN: '+data.pincode : ''
        ].filter(Boolean).join(', ');
        order.delivery_address=data;
        localStorage.setItem('dp_temp_order',JSON.stringify(order));
      }
    }catch(e){}

      // अगली स्क्रीन
      window.location.href='confirm-details.html';
    }
  });
})();
</script>
</body>
</html>
