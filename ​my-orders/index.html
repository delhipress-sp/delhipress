            </div>

            <div id="ordersList">
                <p style="text-align: center; color: #64748b; padding: 25px;">ऑर्डर्स लोड हो रहे हैं...</p>
            </div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://urzmdriydbofeoitvipj.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyem1kcml5ZGJvZmVvaXR2aXBqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTgxNDgsImV4cCI6MjEwMzU5NDE0OH0.yN7h1YBvc7zva2BIAQPgQ1nA4TXRM7ZRPqJKKlmK7Ko";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function initMyOrdersPage() {
            // हर जगह इस्तेमाल होने वाली अलग-अलग keys को एक साथ चेक करें
            let currentUser = null;
            try {
                currentUser = JSON.parse(localStorage.getItem('dp_current_user') || localStorage.getItem('user') || "null");
            } catch(e) {
                currentUser = null;
            }

            const loginCard = document.getElementById('loginRequiredCard');
            const ordersBox = document.getElementById('ordersContainer');
            const greetDisplay = document.getElementById('userGreetName');
            const listArea = document.getElementById('ordersList');

            // 1. अगर यूज़र लॉगिन नहीं है
            if (!currentUser) {
                loginCard.style.display = 'block';
                ordersBox.style.display = 'none';
                return;
            }

            // 2. यूज़र लॉगिन है
            loginCard.style.display = 'none';
            ordersBox.style.display = 'block';
            greetDisplay.innerText = currentUser.name ? "ग्राहक: " + currentUser.name : "";

            const email = currentUser.email || currentUser.email || "";

            try {
                // Supabase से ग्राहक के ऑर्डर्स निकालना
                const { data: orders, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .eq('customer_email', email)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!orders || orders.length === 0) {
                    listArea.innerHTML = `
                        <div class="auth-card" style="padding: 25px;">
                            <i class="fa-regular fa-folder-open" style="font-size: 38px; color: #94a3b8;"></i>
                            <h4 style="margin-top: 8px;">कोई ऑर्डर नहीं मिला</h4>
                            <p style="margin-bottom: 0;">ईमेल (${email}) से अभी कोई ऑर्डर दर्ज नहीं है।</p>
                        </div>
                    `;
                    return;
                }

                let html = "";
                orders.forEach(ord => {
                    const d = new Date(ord.created_at);
                    const dt = `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()} ${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}`;
                    const details = ord.order_data || {};

                    html += `
                        <div class="order-card">
                            <div class="order-header">
                                <span class="order-id"><i class="fa-solid fa-receipt"></i> ${ord.order_title || ord.service_type || 'ऑर्डर'}</span>
                                <span class="order-date">${dt}</span>
                            </div>
                            <div class="order-body">
                                <div class="detail-row">
                                    <span class="detail-label">सर्विस प्रकार:</span>
                                    <span class="detail-value">${ord.service_type || '-'}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">कार्ड मॉडल:</span>
                                    <span class="detail-value">${details.card_model || details.model || '-'}</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">मात्रा (Qty):</span>
                                    <span class="detail-value">${details.quantity || 1} पीस</span>
                                </div>
                                <div class="detail-row">
                                    <span class="detail-label">कुल बिल:</span>
                                    <span class="detail-value" style="color:var(--primary); font-size:15px;">₹${ord.total_amount || 0}</span>
                                </div>

                                ${(details.dulha_name || details.dulhan_name || details.event_date || details.full_matter) ? `
                                    <div class="matter-box">
                                        <h5><i class="fa-solid fa-file-lines"></i> छपाई विवरण:</h5>
                                        ${details.dulha_name ? `<div><b>दूल्हा:</b> ${details.dulha_name}</div>` : ''}
                                        ${details.dulhan_name ? `<div><b>दुल्हन:</b> ${details.dulhan_name}</div>` : ''}
                                        ${details.event_date ? `<div><b>दिनांक:</b> ${details.event_date}</div>` : ''}
                                        ${details.full_matter ? `<div style="margin-top: 4px;"><b>मैटर:</b><br>${details.full_matter}</div>` : ''}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });

                listArea.innerHTML = html;

            } catch (err) {
                listArea.innerHTML = `<p style="color:red; text-align:center;">डेटा लोड नहीं हो सका: ${err.message}</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', initMyOrdersPage);
    </script>
</body>
</html>
