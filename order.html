<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ऑर्डर फॉर्म - दिल्ली प्रेस</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #e63946;
            --primary-gradient: linear-gradient(135deg, #e63946 0%, #d62828 100%);
            --secondary: #f77f00;
            --dark: #0f172a;
            --green: #10b981;
            --blue: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(255, 255, 255, 0.6);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 25px rgba(230, 57, 70, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #0d1322;
            background-image: 
                radial-gradient(at 0% 0%, rgba(230, 57, 70, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.18) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(247, 127, 0, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #1e293b;
            line-height: 1.5;
            padding-bottom: 75px;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 18px;
        }
        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .nav-logo-img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); }
        .nav-brand h2 { color: #ffffff; font-size: 20px; font-weight: 800; }

        .nav-actions { display: flex; align-items: center; gap: 10px; }
        .btn-cart-nav {
            position: relative; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 7px 14px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 700;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .cart-badge-count { background: var(--primary); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 10px; }

        .btn-nav { text-decoration: none; color: #f8fafc; font-weight: 700; font-size: 13px; padding: 7px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.08); }
        
        .container { max-width: 900px; margin: 20px auto; padding: 0 14px; }
        .form-wrapper { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); padding: 24px; border-radius: 16px; box-shadow: var(--card-shadow); margin-bottom: 30px; }
        .section-header { color: var(--dark); font-size: 22px; text-align: center; margin-bottom: 20px; font-weight: 800; }
        
        .form-block { background: #f8fafc; padding: 16px; border-radius: 10px; margin-bottom: 18px; border-left: 4px solid var(--primary); }
        .form-group { margin-bottom: 14px; }
        .row-2, .row-3 { display: flex; gap: 12px; flex-wrap: wrap; }
        .row-2 .form-group { flex: 1; min-width: 200px; }
        .row-3 .form-group { flex: 1; min-width: 140px; }

        label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 5px; color: #334155; }
        input, select, textarea { width: 100%; padding: 11px 13px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #ffffff; }

        .total-bill-box { background: #fef08a; border: 1px solid #facc15; padding: 14px 18px; border-radius: 10px; margin: 16px 0; display: flex; justify-content: space-between; font-size: 16px; font-weight: 800; color: #854d0e; }
        .btn-order-now { width: 100%; padding: 16px; background: linear-gradient(135deg, #10b981, #059669); color: white; font-size: 18px; font-weight: 800; border: none; border-radius: 10px; cursor: pointer; margin-top: 24px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a class="nav-brand" href="index.html">
            <img src="https://kommodo.ai/i/AjEZMpWkUkG0POxk0HVQ" alt="Logo" class="nav-logo-img">
            <h2>दिल्ली प्रेस</h2>
        </a>
        <div class="nav-actions">
            <a href="cart.html" class="btn-cart-nav">
                <i class="fa-solid fa-cart-shopping"></i> कार्ट <span class="cart-badge-count" id="navCartBadge">0</span>
            </a>
            <a href="index.html" class="btn-nav"><i class="fa-solid fa-house"></i> होम पेज</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-wrapper">
            <div class="section-header" id="currentSectionTitle">शादी कार्ड ऑर्डर फॉर्म</div>

            <form id="masterOrderForm" onsubmit="event.preventDefault(); processUniversalOrder();">
                <div class="form-block" style="border-left-color: var(--blue);">
                    <h4><i class="fa-solid fa-user-tag"></i> ग्राहक का विवरण</h4>
                    <div class="row-2">
                        <div class="form-group"><label>ग्राहक का पूरा नाम:</label><input type="text" id="custFullName" required></div>
                        <div class="form-group"><label>मोबाइल नंबर / WhatsApp:</label><input type="tel" id="custMobile" required></div>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;"><label>पूरा पता:</label><input type="text" id="custFullAddress" required></div>
                </div>

                <div class="form-block">
                    <h4>१. कार्ड विवरण व संख्या</h4>
                    <div class="row-3">
                        <div class="form-group"><label>कार्ड मॉडल / नाम:</label><input type="text" id="cardCategory" value="शादी कार्ड"></div>
                        <div class="form-group"><label>प्रति पीस रेट (₹):</label><input type="number" id="cardRate" value="10" min="0" oninput="calculateWeddingTotal()"></div>
                        <div class="form-group"><label>संख्या (Quantity):</label><input type="number" id="cardQty" value="100" min="1" oninput="calculateWeddingTotal()"></div>
                    </div>
                </div>

                <div class="form-block">
                    <h4>२. दूल्हा-दुल्हन का विवरण</h4>
                    <div class="row-2">
                        <div class="form-group"><label>वर (दूल्हा) का नाम:</label><input type="text" id="groomName" placeholder="लड़का का नाम"></div>
                        <div class="form-group"><label>वधू (दुल्हन) का नाम:</label><input type="text" id="brideName" placeholder="लड़की का नाम"></div>
                    </div>
                </div>

                <div class="total-bill-box">
                    <span>कुल बिल राशि:</span>
                    <span id="universalTotalDisplay">₹1000</span>
                </div>

                <div class="form-block">
                    <div class="row-2">
                        <div class="form-group"><label>एडवांस जमा (₹):</label><input type="number" id="universalAdvanceInput" value="500"></div>
                    </div>
                </div>

                <button type="submit" class="btn-order-now">
                    <i class="fa-solid fa-bag-shopping"></i> Order Now (भुगतान पृष्ठ पर जाएं)
                </button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qsvhtfkrlzclnqwypfdy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdmh0ZmtybHpjbG5xd3lwZmR5InIscm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDc3NjMsImV4cCI6MjEwMzgyMzc2M30.HLYUjfCK0w9d6C_-uPMFv-eAe6Cd_YkueSo--iHOUys";
        let supabaseClient = null;
        try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) {}

        function calculateWeddingTotal() {
            const rate = parseFloat(document.getElementById('cardRate').value) || 0;
            const qty = parseInt(document.getElementById('cardQty').value) || 0;
            const total = rate * qty;
            document.getElementById('universalTotalDisplay').innerText = `₹${total}`;
            document.getElementById('universalAdvanceInput').value = Math.round(total * 0.5);
        }

        function processUniversalOrder() {
            const fullName = document.getElementById('custFullName').value;
            const mobile = document.getElementById('custMobile').value;
            const address = document.getElementById('custFullAddress').value;
            const rate = parseFloat(document.getElementById('cardRate').value) || 0;
            const qty = parseInt(document.getElementById('cardQty').value) || 100;
            const total = rate * qty;
            const advance = parseFloat(document.getElementById('universalAdvanceInput').value) || 0;

            const payload = {
                id: Date.now(),
                customer_name: fullName,
                mobile: mobile,
                phone: mobile,
                address: address,
                card_title: document.getElementById('cardCategory').value || 'शादी कार्ड',
                quantity: qty,
                total_amount: total,
                advance_paid: advance,
                balance_amount: Math.max(0, total - advance),
                groom_name: document.getElementById('groomName').value || '-',
                bride_name: document.getElementById('brideName').value || '-',
                status: 'Pending',
                created_at: new Date().toISOString()
            };

            localStorage.setItem('dp_temp_order', JSON.stringify(payload));
            window.location.href = "payment.html";
        }
    </script>
</body>
</html>
