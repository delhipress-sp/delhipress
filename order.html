<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>शादी कार्ड ऑर्डर फॉर्म</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-info">
            <h1>दिल्ली प्रेस</h1>
            <p>सज्जद डिजिटल प्रिंट्स</p>
        </div>
    </header>

    <main>
        <section class="form-section">
            <h2>शादी कार्ड ऑर्डर फॉर्म</h2>
            <form action="/submit-order" method="POST">
                <!-- 1. कार्ड कैटेगरी, रेट एवं संख्या -->
                <fieldset>
                    <legend>1. कार्ड कैटेगरी, रेट एवं संख्या</legend>
                    <label for="card-model">कार्ड मॉडल / कैटेगरी:</label>
                    <input type="text" id="card-model" name="card-model" value="मुस्लिम निकाह कार्ड (शाही)" readonly>

                    <label for="price">प्रति पीस रेट (₹):</label>
                    <input type="number" id="price" name="price" value="12" readonly>

                    <label for="quantity">संख्या (Quantity):</label>
                    <input type="number" id="quantity" name="quantity" value="100" readonly>

                    <p>कुल राशि: <strong>₹1,200</strong></p>
                </fieldset>

                <!-- यहाँ बाकी फॉर्म के फील्ड्स आएंगे -->
                <!-- फील्ड 2, 3, 4, 5 और 6 -->
                
                <button type="submit" class="checkout-btn">चेकआउट करें (Proceed to Checkout)</button>
            </form>
        </section>
    </main>

    <footer>
        <nav class="bottom-nav">
            <a href="tel:9304509464"><i class="fas fa-phone"></i> कॉल करें</a>
            <a href="index.html"><i class="fas fa-home"></i> होम</a>
            <a href="order.html" class="active"><i class="fas fa-shopping-cart"></i> ऑर्डर</a>
            <a href="my-order.html"><i class="fas fa-list"></i> मेरे ऑर्डर्स</a>
            <a href="admin.html"><i class="fas fa-user-circle"></i> Md</a>
        </nav>
    </footer>
</body>
</html>
