<!DOCTYPE html><html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>दिल्ली प्रेस (सज्जाद प्रिंटर्स) - जामताड़ा</title>

<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    :root {
        --red: #e63946;
        --red-dark: #c9182b;
        --blue: #0756d9;
        --blue-dark: #062b68;
        --green: #10b981;
        --yellow: #facc15;
        --orange: #f97316;
        --dark: #07152f;
        --text: #14213d;
        --muted: #64748b;
        --white: #ffffff;
        --light: #f7faff;
        --border: #dbe4f0;
        --shadow: 0 10px 30px rgba(7, 21, 47, .12);
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Mukta','Poppins',sans-serif;
        -webkit-tap-highlight-color: transparent;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        min-height: 100vh;
        color: var(--text);
        background:
            radial-gradient(circle at 0% 0%, rgba(230,57,70,.22), transparent 28%),
            radial-gradient(circle at 100% 10%, rgba(37,99,235,.25), transparent 30%),
            radial-gradient(circle at 50% 60%, rgba(16,185,129,.10), transparent 30%),
            linear-gradient(135deg,#06152f,#102d5a 48%,#07152f);
        padding-bottom: 78px;
    }

    /* ================= TOP BAR ================= */

    .top-bar {
        height: 38px;
        background: rgba(3,13,32,.94);
        color: #dbeafe;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 28px;
        font-size: 13px;
        border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .top-left {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .top-left i,
    .top-right i {
        color: var(--yellow);
    }

    .top-right a {
        color: #fff;
        text-decoration: none;
        font-weight: 800;
    }

    /* ================= NAVBAR ================= */

    .navbar {
        position: sticky;
        top: 0;
        z-index: 1000;
        min-height: 70px;
        padding: 9px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        background: rgba(5,20,47,.94);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255,255,255,.14);
        box-shadow: 0 8px 25px rgba(0,0,0,.12);
    }

    .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        min-width: 245px;
    }

    .nav-logo-box {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: #fff;
        border: 3px solid var(--red);
        box-shadow: 0 0 0 3px rgba(255,255,255,.15),
                    0 5px 18px rgba(230,57,70,.45);
        overflow: hidden;
        flex-shrink: 0;
    }

    .nav-logo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .brand-title {
        color: #fff;
        font-size: 22px;
        line-height: 1;
        font-weight: 800;
    }

    .brand-subtitle {
        color: #cbd5e1;
        font-size: 11px;
        margin-top: 3px;
    }

    .nav-menu {
        display: flex;
        list-style: none;
        align-items: center;
        gap: 3px;
    }

    .nav-menu a {
        color: #f8fafc;
        text-decoration: none;
        padding: 9px 11px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        transition: .2s;
    }

    .nav-menu a:hover {
        background: rgba(255,255,255,.09);
        color: #fff;
    }

    .admin-link {
        color: var(--yellow) !important;
    }

    .btn-cart {
        color: #fff;
        text-decoration: none;
        border: 1px solid rgba(255,255,255,.28);
        background: rgba(255,255,255,.10);
        border-radius: 24px;
        padding: 8px 14px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 800;
        position: relative;
    }

    .cart-count {
        background: var(--red);
        color: #fff;
        min-width: 20px;
        height: 20px;
        border-radius: 20px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        font-size: 10px;
        font-weight: 800;
    }

    /* ================= MAIN ================= */

    .container {
        width: min(1100px, calc(100% - 28px));
        margin: 14px auto 30px;
    }

    /* ================= HERO ================= */

    .hero {
        position: relative;
        overflow: hidden;
        min-height: 250px;
        border-radius: 22px;
        padding: 25px 30px;
        margin-bottom: 14px;
        background:
            linear-gradient(100deg,rgba(255,255,255,.98),rgba(255,248,235,.96));
        border: 2px solid rgba(255,255,255,.9);
        box-shadow: 0 15px 40px rgba(0,0,0,.18);
    }

    .hero:before {
        content: "";
        position: absolute;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: rgba(230,57,70,.10);
        left: -100px;
        top: -100px;
    }

    .hero:after {
        content: "";
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: rgba(37,99,235,.10);
        right: -80px;
        bottom: -120px;
    }

    .hero-inner {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 1fr 1.55fr .8fr;
        align-items: center;
        gap: 18px;
    }

    .hero-cards {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .hero-cards img {
        width: 100%;
        max-width: 270px;
        height: 185px;
        object-fit: cover;
        border-radius: 15px;
        box-shadow: 0 12px 25px rgba(0,0,0,.18);
    }

    .hero-content {
        text-align: center;
    }

    .hero-brand {
        display: inline-block;
        color: #fff;
        background: linear-gradient(135deg,var(--red),var(--red-dark));
        padding: 5px 17px;
        border-radius: 25px;
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 7px;
    }

    .hero h1 {
        color: #071e68;
        font-size: 31px;
        line-height: 1.08;
        font-weight: 800;
    }

    .hero p {
        color: #334155;
        font-size: 15px;
        margin: 8px 0 14px;
    }

    .hero-order-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        color: #fff;
        background: linear-gradient(135deg,#10b981,#059669);
        text-decoration: none;
        border-radius: 30px;
        padding: 12px 23px;
        font-size: 15px;
        font-weight: 800;
        box-shadow: 0 7px 20px rgba(16,185,129,.35);
    }

    .hero-features {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .hero-feature {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 800;
        color: #14213d;
    }

    .hero-feature i {
        color: var(--green);
        font-size: 20px;
    }

    /* ================= NOTICE ================= */

    .notice {
        display: flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(90deg,#fff4cc,#fff9e9);
        color: #713f12;
        border: 1px solid #fbbf24;
        border-radius: 13px;
        padding: 12px 16px;
        margin-bottom: 14px;
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 5px 15px rgba(0,0,0,.08);
    }

    .notice i {
        color: #ea580c;
        font-size: 21px;
    }

    /* ================= CARDS / PANELS ================= */

    .panel {
        background: rgba(255,255,255,.97);
        border-radius: 19px;
        padding: 19px;
        margin-bottom: 15px;
        border: 1px solid rgba(255,255,255,.8);
        box-shadow: var(--shadow);
    }

    .panel-title {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #092265;
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 3px;
    }

    .panel-title i {
        color: var(--red);
    }

    .panel-subtitle {
        color: #475569;
        font-size: 13px;
        margin-bottom: 13px;
    }

    /* ================= CATALOG FILTER ================= */

    .filter-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        background: #edf3fb;
        border: 1px solid #d5e1ef;
        border-radius: 12px;
        padding: 10px 13px;
        margin-bottom: 13px;
    }

    .filter-label {
        font-size: 15px;
        font-weight: 800;
        white-space: nowrap;
    }

    .filter-label i {
        color: var(--red);
    }

    .category-select {
        width: 280px;
        max-width: 100%;
        padding: 9px 12px;
        border-radius: 9px;
        border: 1.5px solid #aabbd0;
        background: #fff;
        color: #10213d;
        font-size: 14px;
        font-weight: 700;
        outline: none;
    }

    /* ================= PRODUCT GRID ================= */

    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(4,1fr);
        gap: 13px;
    }

    .product-card {
        overflow: hidden;
        background: #fff;
        border: 1px solid #dbe4f0;
        border-radius: 13px;
        box-shadow: 0 5px 15px rgba(0,0,0,.07);
        transition: .25s;
    }

    .product-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px rgba(0,0,0,.12);
    }

    .product-img {
        height: 155px;
        background: #f1f5f9;
        position: relative;
        overflow: hidden;
        cursor: pointer;
    }

    .product-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .zoom-badge {
        position: absolute;
        right: 8px;
        bottom: 8px;
        color: #fff;
        background: rgba(4,15,37,.82);
        padding: 4px 8px;
        border-radius: 7px;
        font-size: 10px;
        font-weight: 700;
    }

    .product-info {
        padding: 10px;
        text-align: center;
    }

    .product-info h4 {
        color: #14213d;
        font-size: 15px;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .model {
        color: #64748b;
        font-size: 12px;
        font-weight: 600;
    }

    .price {
        color: var(--red);
        font-size: 17px;
        font-weight: 800;
        margin: 3px 0;
    }

    .stock {
        display: inline-block;
        padding: 3px 9px;
        border-radius: 20px;
        font-size: 10px;
        font-weight: 800;
        margin-bottom: 7px;
    }

    .stock.in {
        background: #dcfce7;
        color: #15803d;
    }

    .stock.out {
        background: #fee2e2;
        color: #b91c1c;
    }

    .product-actions {
        display: flex;
        gap: 5px;
    }

    .order-card-btn {
        flex: 1;
        border: none;
        border-radius: 7px;
        background: linear-gradient(135deg,#2563eb,#0756d9);
        color: #fff;
        padding: 8px 5px;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
    }

    .cart-card-btn {
        width: 38px;
        border-radius: 7px;
        border: 1px solid #cbd5e1;
        background: #f8fafc;
        color: #14213d;
        cursor: pointer;
    }

    /* ================= INFO ================= */

    .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
    }

    .info-box {
        background: rgba(255,255,255,.98);
        border-radius: 17px;
        padding: 18px;
        box-shadow: var(--shadow);
    }

    .info-header {
        color: #092265;
        font-size: 20px;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 2px solid #e5e7eb;
        padding-bottom: 8px;
        margin-bottom: 10px;
    }

    .info-header i {
        color: var(--red);
    }

    .info-box p,
    .info-box li {
        color: #475569;
        font-size: 13px;
        line-height: 1.7;
    }

    .terms {
        list-style: none;
    }

    .terms li {
        position: relative;
        padding-left: 23px;
        margin-bottom: 8px;
    }

    .terms li i {
        position: absolute;
        left: 0;
        top: 5px;
        color: var(--orange);
    }

    /* ================= LOCATION ================= */

    .location-box {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        align-items: stretch;
    }

    .address {
        padding: 10px 0;
    }

    .address p {
        margin-bottom: 8px;
    }

    .map-button {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #fff;
        background: #2563eb;
        text-decoration: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 800;
        margin-top: 5px;
    }

    .map-wrapper {
        min-height: 210px;
        overflow: hidden;
        border-radius: 13px;
        border: 1px solid #cbd5e1;
    }

    .map-wrapper iframe {
        width: 100%;
        height: 100%;
        min-height: 210px;
        border: 0;
    }

    /* ================= FOOTER ================= */

    .footer {
        position: relative;
        overflow: hidden;
        color: #cbd5e1;
        background: linear-gradient(135deg,#03122d,#082c63 55%,#06152f);
        border-top: 1px solid rgba(255,255,255,.12);
        padding: 34px 20px 24px;
    }

    .footer-grid {
        max-width: 1100px;
        margin: auto;
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr;
        gap: 30px;
    }

    .footer h3 {
        color: #fff;
        font-size: 18px;
        margin-bottom: 10px;
    }

    .footer p {
        font-size: 13px;
        color: #aebed3;
        line-height: 1.7;
        margin-bottom: 5px;
    }

    .footer i {
        color: var(--yellow);
        width: 20px;
    }

    .footer-services {
        color: #dbeafe !important;
    }

    .footer-bottom {
        max-width: 1100px;
        margin: 22px auto 0;
        padding-top: 14px;
        border-top: 1px solid rgba(255,255,255,.12);
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        font-size: 12px;
        color: #8194ad;
    }

    .footer-admin {
        color: var(--yellow);
        text-decoration: none;
        font-weight: 800;
    }

    /* ================= MOBILE BAR ================= */

    .mobile-bar {
        display: none;
        position: fixed;
        z-index: 2000;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 70px;
        background: rgba(4,18,43,.97);
        backdrop-filter: blur(14px);
        border-top: 1px solid rgba(255,255,255,.16);
        justify-content: space-around;
        align-items: center;
    }

    .mobile-bar a {
        color: #dbeafe;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 10px;
        font-weight: 700;
        position: relative;
    }

    .mobile-bar i {
        color: #fff;
        font-size: 18px;
    }

    .mobile-cart-count {
        position: absolute;
        top: -7px;
        right: -10px;
        background: var(--red);
        color: #fff;
        min-width: 17px;
        height: 17px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
    }

    /* ================= ZOOM ================= */

    .zoom-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: rgba(1,10,25,.96);
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
    }

    .zoom-modal.active {
        display: flex;
    }

    .zoom-header {
        width: 100%;
        max-width: 900px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #fff;
        margin-bottom: 10px;
    }

    .zoom-title {
        font-size: 17px;
        font-weight: 800;
    }

    .zoom-close {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        background: #ef4444;
        color: #fff;
        font-size: 22px;
        cursor: pointer;
    }

    .zoom-body {
        width: 100%;
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }

    .zoom-img {
        max-width: 94%;
        max-height: 78vh;
        object-fit: contain;
        border-radius: 10px;
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width:900px) {
        .nav-menu {
            display: none;
        }

        .hero-inner {
            grid-template-columns: 1fr 1.4fr;
        }

        .hero-features {
            display: none;
        }

        .gallery-grid {
            grid-template-columns: repeat(2,1fr);
        }

        .footer-grid {
            grid-template-columns: 1fr 1fr;
        }
    }

    @media(max-width:650px) {

        body {
            padding-bottom: 75px;
        }

        .top-bar {
            height: auto;
            padding: 6px 10px;
            font-size: 10px;
        }

        .top-left {
            gap: 5px;
        }

        .top-right {
            display: none;
        }

        .navbar {
            padding: 8px 10px;
            min-height: 63px;
        }

        .nav-brand {
            min-width: 0;
        }

        .nav-logo-box {
            width: 42px;
            height: 42px;
        }

        .brand-title {
            font-size: 18px;
        }

        .brand-subtitle {
            font-size: 9px;
        }

        .btn-cart {
            padding: 7px 9px;
            font-size: 11px;
        }

        .container {
            width: calc(100% - 14px);
            margin-top: 8px;
        }

        .hero {
            padding: 13px;
            border-radius: 16px;
            min-height: auto;
        }

        .hero-inner {
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .hero-cards {
            order: 1;
        }

        .hero-cards img {
            height: 145px;
            max-width: 100%;
        }

        .hero-content {
            order: 2;
        }

        .hero-brand {
            font-size: 11px;
            padding: 4px 12px;
        }

        .hero h1 {
            font-size: 23px;
        }

        .hero p {
            font-size: 12px;
        }

        .hero-order-btn {
            font-size: 13px;
            padding: 10px 17px;
        }

        .notice {
            font-size: 11px;
            padding: 9px 10px;
        }

        .panel,
        .info-box {
            padding: 13px;
            border-radius: 14px;
        }

        .panel-title,
        .info-header {
            font-size: 18px;
        }

        .filter-row {
            align-items: stretch;
            flex-direction: column;
            gap: 7px;
        }

        .catego
