<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>दिल्ली प्रेस (सज्जाद प्रिंटर्स) - जामताड़ा</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    
    <style>
        :root{
            --red:#e51e3b;
            --red2:#c8102e;
            --blue:#063b91;
            --blue2:#075fe5;
            --navy:#031735;
            --green:#08a86a;
            --gold:#ffb400;
            --orange:#ff7a00;
            --white:#fff;
            --ink:#10245c;
            --muted:#5b6b86;
            --panel:rgba(255,255,255,.97);
            --shadow:0 10px 28px rgba(0,20,55,.16);
        }

        *{box-sizing:border-box;margin:0;padding:0;font-family:'Mukta','Poppins',sans-serif;-webkit-tap-highlight-color:transparent}
        html{scroll-behavior:smooth}
        body{
            min-height:100vh;color:#10245c;line-height:1.45;padding-bottom:78px;
            background:
                radial-gradient(circle at 0% 5%,rgba(229,30,59,.30),transparent 23%),
                radial-gradient(circle at 100% 15%,rgba(0,115,255,.28),transparent 28%),
                radial-gradient(circle at 50% 45%,rgba(255,190,0,.10),transparent 30%),
                radial-gradient(circle at 100% 100%,rgba(0,190,150,.24),transparent 28%),
                linear-gradient(135deg,#07214d 0%,#0a5c91 50%,#062b58 100%);
            background-attachment:fixed;
        }

        /* TOP CONTACT STRIP */
        .top-bar{
            height:40px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;
            color:#fff;background:rgba(2,20,51,.96);border-bottom:1px solid rgba(255,255,255,.22);
            font-size:13px;
        }
        .top-left{display:flex;gap:9px;align-items:center}
        .top-bar i{color:#ffd21c;margin-right:4px}
        .top-bar a{color:#ffd21c;text-decoration:none;font-weight:800}

        /* NAV */
        .navbar{
            min-height:72px;padding:8px 30px;display:flex;align-items:center;gap:18px;
            position:sticky;top:0;z-index:1000;
            background:rgba(3,23,55,.94);backdrop-filter:blur(15px);
            border-bottom:1px solid rgba(255,255,255,.16);
        }
        .nav-brand{display:flex;align-items:center;gap:11px;text-decoration:none;min-width:300px}
        .nav-logo-box{
            width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid #fff;
            box-shadow:0 0 0 3px rgba(229,30,59,.28),0 5px 18px rgba(0,0,0,.25);
            overflow:hidden;flex-shrink:0;
        }
        .nav-logo-img{width:100%;height:100%;object-fit:cover}
        .nav-brand-text h2{color:#ff1744;font-size:24px;line-height:1;font-weight:800}
        .nav-brand-text p{color:#fff;font-size:12px;margin-top:4px}
        .nav-menu{display:flex;align-items:center;gap:3px;list-style:none;flex:1;justify-content:center}
        .nav-menu a{
            color:#fff;text-decoration:none;font-size:13px;font-weight:700;padding:10px 10px;
            border-radius:8px;transition:.2s;white-space:nowrap
        }
        .nav-menu a:hover{background:rgba(255,255,255,.10);color:#ffd21c}
        .nav-menu .home-link{border-bottom:3px solid #ffd21c;border-radius:0}
        .btn-login{background:linear-gradient(135deg,#e51e3b,#c8102e)!important;color:#fff!important;border-radius:20px!important;padding:7px 14px!important}
        .user-logged-box{display:none;align-items:center}
        .btn-my-orders{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff!important;border-radius:20px!important;padding:7px 14px!important;text-decoration:none}
        .nav-right-cluster{display:flex;align-items:center;gap:8px}
        .btn-lang-toggle{display:none}
        .btn-cart-nav{
            position:relative;display:inline-flex;align-items:center;gap:7px;text-decoration:none;
            color:#fff;font-size:13px;font-weight:800;padding:9px 15px;border-radius:26px;
            border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.09)
        }
        .cart-badge-count{
            background:#f21c43;color:#fff;font-size:10px;font-weight:800;min-width:21px;height:21px;
            display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
        }

        /* PAGE */
        .container{max-width:1100px;margin:10px auto 22px;padding:0 12px}

        /* HERO */
        .hero{
            position:relative;overflow:hidden;min-height:250px;border-radius:22px;padding:16px 22px;
            margin-bottom:10px;background:linear-gradient(100deg,#fff7df,#fffef7 48%,#fff9e9);
            border:4px solid rgba(255,255,255,.92);box-shadow:0 10px 25px rgba(0,0,0,.22);
        }
        .hero:before,.hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
        .hero:before{width:250px;height:250px;left:-130px;top:-120px;background:rgba(229,30,59,.10)}
        .hero:after{width:250px;height:250px;right:-130px;bottom:-140px;background:rgba(5,95,229,.10)}
        .hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr 1.65fr .9fr;align-items:center;gap:18px}
        .hero-cards{height:215px;position:relative;display:flex;align-items:center;justify-content:center}
        .fake-card{
            position:absolute;width:120px;height:178px;border-radius:7px;box-shadow:0 10px 20px rgba(0,0,0,.24);
            display:flex;align-items:center;justify-content:center;text-align:center;font-family:serif;
            border:5px solid rgba(255,255,255,.78);font-size:16px;font-weight:700
        }
        .fake-card small{display:block;font-size:10px;margin-top:8px;font-family:'Mukta'}
        .fake-card.one{background:linear-gradient(145deg,#6f0014,#e62b39 65%,#ffc76a);transform:rotate(-12deg);left:10px;top:24px;color:#ffd78b}
        .fake-card.two{background:linear-gradient(145deg,#fffaf0,#ffe1bd 55%,#e34d2e);transform:rotate(2deg);z-index:2;color:#bd2934}
        .fake-card.three{background:linear-gradient(145deg,#063b2e,#0d6a54 60%,#d2a33e);transform:rotate(12deg);right:10px;top:25px;color:#f5d77a}
        .hero-content{text-align:center}
        .hero-brand{
            display:inline-block;background:linear-gradient(135deg,#ed163b,#cf1735);color:#fff;
            border-radius:24px;padding:5px 19px;font-size:15px;font-weight:800;margin-bottom:7px;
            box-shadow:0 5px 12px rgba(229,30,59,.22)
        }
        .hero h1{font-size:34px;line-height:1.04;color:#082e8c;font-weight:800}
        .hero p{font-size:15px;color:#263c63;margin:8px 0 12px}
        .btn-main-order{
            display:inline-flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;color:#fff;
            background:linear-gradient(135deg,#09b878,#06945f);padding:12px 27px;border-radius:32px;
            font-size:16px;font-weight:800;box-shadow:0 8px 20px rgba(0,166,105,.32)
        }
        .hero-features{display:flex;flex-direction:column;gap:14px;padding-left:6px}
        .hero-feature{display:flex;align-items:center;gap:10px;color:#16264c;font-size:14px;font-weight:800}
        .hero-feature i{width:30px;text-align:center;font-size:23px}
        .hero-feature:nth-child(1) i{color:#171717}.hero-feature:nth-child(2) i{color:#1675e8}
        .hero-feature:nth-child(3) i{color:#d71939}.hero-feature:nth-child(4) i{color:#09a86a}

        /* NOTICE */
        .notice-banner{
            margin-bottom:10px;padding:12px 17px;border-radius:15px;border:1px solid #f3bd3c;
            background:linear-gradient(90deg,#fff0c4,#fff9e5);color:#6d390d;display:flex;align-items:center;
            gap:10px;font-size:14px;font-weight:800;box-shadow:0 7px 18px rgba(0,0,0,.10)
        }
        .notice-banner i{color:#ef5b18;font-size:23px}

        /* CATALOG */
        .showcase-box{
            background:rgba(255,255,255,.98);border-radius:19px;padding:18px 20px;margin-bottom:10px;
            box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.9)
        }
        .catalog-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:11px}
        .catalog-heading{display:flex;align-items:center;gap:10px}
        .catalog-heading i{color:#e91b40;font-size:30px}
        .showcase-header-title{color:#08266f;font-size:24px;font-weight:800}
        .catalog-sub{font-size:13px;color:#17325f}
        .filter-box{
            display:flex;align-items:center;gap:9px;background:#f0f5fb;border-radius:11px;padding:7px 11px;
            border:1px solid #d9e4ef;min-width:285px
        }
        .filter-box>i{color:#ed1b40;font-size:20px}
        .filter-box label{font-size:13px;font-weight:800;white-space:nowrap}
        .category-select{
            border:0;background:transparent;outline:none;font-size:13px;font-weight:800;color:#152a5b;
            width:150px
        }
        .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
        .card-sample{
            border:1px solid #dbe5ef;border-radius:12px;overflow:hidden;background:#fff;
            box-shadow:0 4px 12px rgba(0,0,0,.06);display:flex;flex-direction:column;
            transition:.22s
        }
        .card-sample:hover{transform:translateY(-3px);box-shadow:0 9px 20px rgba(0,0,0,.10)}
        .card-sample .img-box{position:relative;overflow:hidden;cursor:pointer;background:#f3f6fa;height:155px}
        .card-sample .img-box img{width:100%;height:100%;object-fit:cover;display:block;transition:.3s}
        .card-sample .img-box:hover img{transform:scale(1.05)}
        .zoom-hint{
            position:absolute;right:7px;bottom:7px;background:rgba(4,12,30,.84);color:#fff;
            padding:4px 9px;border-radius:15px;font-size:10px;font-weight:800
        }
        .card-info{padding:9px 10px 10px;text-align:left}
        .card-info h4{font-size:16px;color:#13265a;margin-bottom:1px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .model-text{font-size:12px;color:#344c77;margin-bottom:2px}
        .card-price-tag{color:#e51e3b;font-size:18px;font-weight:800}
        .stock-badge{display:inline-block;font-size:11px;padding:4px 13px;border-radius:20px;font-weight:800}
        .in-stock{background:#d7f6e8;color:#12945e}.out-stock{background:#ffdfe4;color:#d61c43}
        .card-actions-row{display:flex;gap:7px;margin-top:8px}
        .btn-select-card{
            flex:1.55;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;
            border:0;border-radius:7px;background:linear-gradient(135deg,#0869f1,#0753ce);color:#fff!important;
            font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 4px 9px rgba(7,91,221,.22)
        }
        .btn-add-cart-single{
            flex:.45;display:flex;align-items:center;justify-content:center;border-radius:7px;
            background:#f2f6fa;border:1px solid #cbd9e8;color:#122b59;font-size:16px;cursor:pointer
        }

        /* BENEFITS */
        .benefit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}
        .benefit{
            background:rgba(255,255,255,.98);border-radius:17px;padding:10px 15px;display:flex;align-items:center;gap:12px;
            box-shadow:0 7px 18px rgba(0,0,0,.10)
        }
        .benefit-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:23px;flex-shrink:0}
        .benefit:nth-child(1) .benefit-icon{background:#09ae74}.benefit:nth-child(2) .benefit-icon{background:#ff7b00}.benefit:nth-child(3) .benefit-icon{background:#7839df}
        .benefit h4{font-size:16px;color:#09256b}.benefit p{font-size:11px;color:#405575}

        /* INFO */
        .info-card{
            background:rgba(255,255,255,.98);border-radius:17px;padding:16px 20px;margin-bottom:10px;
            box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.9)
        }
        .info-card-header{
            display:flex;align-items:center;gap:9px;color:#08266f;font-size:21px;font-weight:800;
            margin-bottom:8px
        }
        .info-card-header i{color:#e91b40}
        .about-flex{display:flex;align-items:center;gap:20px}
        .about-copy{flex:1}
        .about-copy p{font-size:14px;color:#243b68;line-height:1.65}
        .quality-list{display:flex;flex-direction:column;gap:8px;min-width:150px;flex-shrink:0}
        .quality-list span{font-size:15px;font-weight:800;display:flex;align-items:center;gap:7px}
        .quality-list span:nth-child(1){color:#e91b40}.quality-list span:nth-child(2){color:#f77f00}.quality-list span:nth-child(3){color:#0787e8}
        .quality-list span i{font-size:14px}

        .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .two-col .info-card{margin-bottom:0}
        .terms-list{list-style:none}
        .terms-list li{position:relative;padding-left:25px;margin-bottom:9px;font-size:13px;color:#334a72;line-height:1.55}
        .terms-list li i{position:absolute;left:0;top:3px;color:#ffad00}
        .location-details{font-size:13px;color:#334a72;line-height:1.65}
        .btn-open-map-direct{
            display:inline-flex;align-items:center;gap:7px;background:#0870e8;color:#fff;text-decoration:none;
            padding:8px 14px;border-radius:8px;font-size:12px;font-weight:800;margin-top:7px
        }
        .map-wrapper{position:relative;height:115px;overflow:hidden;border-radius:11px;border:1px solid #cbd8e7;margin-top:9px}
        .map-wrapper iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

        /* FOOTER */
        .main-footer{
            position:relative;overflow:hidden;margin-top:18px;padding:31px 18px 20px;color:#cbd5e1;
            background:linear-gradient(135deg,#02112e,#06275a 52%,#041934);border-top:1px solid rgba(255,255,255,.15)
        }
        .main-footer:before{
            content:"";position:absolute;left:-5%;right:-5%;top:-26px;height:55px;border-radius:50%;
            background:#fff;opacity:.98
        }
        .footer-grid{position:relative;z-index:1;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:25px}
        .footer-col h4{color:#fff;font-size:17px;margin-bottom:8px}.footer-col p{font-size:13px;color:#b6c5d9;margin-bottom:5px}
        .footer-col p i{color:#ffd21c;width:18px}
        .footer-bottom{position:relative;z-index:1;max-width:1100px;margin:19px auto 0;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;color:#7e92ae}
        .footer-bottom a{color:#ffd21c;text-decoration:none}

        /* MOBILE BOTTOM */
        .mobile-bottom-bar{
            display:none;position:fixed;left:0;bottom:0;width:100%;height:72px;z-index:1001;
            background:rgba(3,22,52,.96);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,.16);
            border-radius:30px 30px 0 0;justify-content:space-around;align-items:center
        }
        .mobile-bottom-bar a{color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;position:relative}
        .mobile-bottom-bar a i{font-size:19px;color:#fff}
        .mobile-bottom-bar .cart-badge-count{position:absolute;top:-7px;right:-10px}

        /* MODALS */
        .zoom-modal{display:none;position:fixed;inset:0;background:rgba(3,10,27,.96);z-index:9999;flex-direction:column;justify-content:space-between;align-items:center}
        .zoom-modal.active{display:flex}
        .zoom-header{width:100%;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;color:#fff}
        .zoom-title{font-size:16px;font-weight:800}
        .btn-zoom-close{background:#ef334e;color:#fff;border:0;width:38px;height:38px;border-radius:50%;font-size:20px;cursor:pointer}
        .zoom-body{width:100%;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
        .zoom-img{max-width:90%;max-height:78vh;object-fit:contain;border-radius:10px;box-shadow:0 12px 35px rgba(0,0,0,.55);transition:.15s}
        .zoom-controls{padding:13px 20px;display:flex;gap:9px;align-items:center;justify-content:center;flex-wrap:wrap}
        .zoom-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);width:41px;height:41px;border-radius:50%;cursor:pointer}
        .zoom-select-btn{background:linear-gradient(135deg,#08b977,#07945f);color:#fff;border:0;padding:10px 19px;border-radius:24px;font-weight:800;cursor:pointer}

        #policyModalOverlay{backdrop-filter:blur(4px)}

        @media(max-width:980px){
            .navbar{padding:8px 15px}.nav-brand{min-width:240px}.nav-menu{gap:0}
            .nav-menu a{padding:8px 7px;font-size:12px}.hero-inner{grid-template-columns:1fr 1.5fr}
            .hero-features{display:none}.gallery-grid{grid-template-columns:repeat(4,1fr)}
        }
        @media(max-width:768px){
            .top-bar{height:auto;padding:6px 10px;font-size:10px}.top-right{display:none}
            .navbar{padding:7px 10px;min-height:60px}.nav-brand{min-width:0}.nav-logo-box{width:43px;height:43px}
            .nav-brand-text h2{font-size:19px}.nav-brand-text p{font-size:9px}
            .nav-menu{display:none}.nav-right-cluster{margin-left:auto}
            .btn-cart-nav{padding:7px 10px;font-size:11px}.btn-lang-toggle{display:none}
            .container{width:100%;padding:0 7px;margin-top:7px}
            .hero{padding:10px;border-radius:16px}.hero-inner{grid-template-columns:1fr;gap:5px}
            .hero-cards{height:140px}.fake-card{width:90px;height:130px;font-size:12px}.fake-card small{font-size:8px}
            .fake-card.one{left:12%;top:8px}.fake-card.two{top:4px}.fake-card.three{right:12%;top:8px}
            .hero-content{padding:0 3px}.hero-brand{font-size:11px;padding:4px 12px}
            .hero h1{font-size:24px}.hero p{font-size:11px;margin:5px 0 8px}.btn-main-order{font-size:12px;padding:10px 15px}
            .notice-banner{font-size:11px;padding:9px 10px;margin-bottom:7px}.notice-banner i{font-size:18px}
            .showcase-box{padding:12px;border-radius:14px}.catalog-head{align-items:flex-start;flex-direction:column}
            .showcase-header-title{font-size:19px}.catalog-heading i{font-size:24px}.catalog-sub{font-size:11px}
            .filter-box{width:100%;min-width:0}.category-select{flex:1;width:auto}
            .gallery-grid{grid-template-columns:repeat(2,1fr);gap:8px}.card-sample .img-box{height:122px}
            .card-info{padding:7px}.card-info h4{font-size:13px}.model-text{font-size:10px}.card-price-tag{font-size:15px}
            .stock-badge{font-size:9px;padding:3px 8px}.btn-select-card{font-size:10px;padding:7px 4px}.btn-add-cart-single{font-size:14px}
            .benefit-grid{grid-template-columns:repeat(3,1fr);gap:6px}.benefit{padding:8px 5px;gap:6px;flex-direction:column;text-align:center}
            .benefit-icon{width:38px;height:38px;font-size:17px}.benefit h4{font-size:11px}.benefit p{font-size:8px;line-height:1.2}
            .info-card{padding:12px;border-radius:14px}.info-card-header{font-size:18px}.about-flex{gap:5px}.about-copy p{font-size:12px}
            .quality-list{min-width:105px;gap:5px}.quality-list span{font-size:12px}.about-flex{align-items:flex-start}.two-col{grid-template-columns:1fr}
            .two-col .info-card{margin-bottom:10px}.location-details{font-size:11px}.map-wrapper{height:150px}
            .main-footer{padding:28px 14px 20px}.footer-grid{grid-template-columns:1fr 1fr;gap:15px}.footer-col:first-child{grid-column:1/-1}
            .footer-col h4{font-size:14px}.footer-col p{font-size:11
