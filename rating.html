<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>रेटिंग और रिव्यू — दिल्ली प्रेस</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172b4d;font-family:Arial,"Noto Sans Devanagari",sans-serif}.top{background:#087cf0;color:#fff;padding:16px 14px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0002}.top-in{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}.back{border:0;background:#ffffff22;color:#fff;border-radius:22px;width:42px;height:42px;font-size:18px;cursor:pointer}.top h1{font-size:20px;margin:0}.wrap{max-width:760px;margin:14px auto;padding:0 10px}.product{background:#fff;border-radius:12px;padding:13px;box-shadow:0 2px 8px #0001;display:flex;gap:12px;align-items:center}.product img{width:92px;height:92px;object-fit:contain;border:1px solid #e5eaf0;border-radius:8px;background:#f8fafc}.product h2{margin:0 0 5px;font-size:17px}.model{font-size:12px;color:#718096}.summary,.form,.reviews{background:#fff;border-radius:12px;padding:15px;margin-top:12px;box-shadow:0 2px 8px #0001}.summary h3,.form h3,.reviews h3{margin:0 0 12px;font-size:18px}.summary-grid{display:grid;grid-template-columns:130px 1fr;gap:18px;align-items:center}.score{text-align:center;border-right:1px solid #e8edf3}.score strong{font-size:42px;display:block}.stars{color:#f5a623;letter-spacing:2px;font-size:21px}.count{font-size:12px;color:#718096}.bars{display:flex;flex-direction:column;gap:7px}.barrow{display:grid;grid-template-columns:30px 1fr 30px;gap:7px;align-items:center;font-size:12px}.track{height:7px;background:#edf1f5;border-radius:10px;overflow:hidden}.fill{height:100%;background:#f5a623}.rating-select{display:flex;justify-content:center;gap:5px;margin:4px 0 13px}.rating-select button{border:0;background:transparent;color:#cbd5e1;font-size:40px;line-height:1;cursor:pointer;padding:3px}.rating-select button.on{color:#f59e0b}input,textarea{width:100%;border:1px solid #d5dce5;border-radius:8px;padding:11px;font-size:14px;margin-bottom:9px;outline:none}textarea{height:100px;resize:vertical}.upload{display:block;border:1px dashed #8eb5eb;background:#f5f9ff;color:#1769d3;text-align:center;border-radius:8px;padding:11px;font-weight:800;cursor:pointer}.upload input{display:none}.previews{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.previews img{width:64px;height:64px;object-fit:cover;border-radius:7px;border:1px solid #ddd}.submit{width:100%;border:0;background:#087cf0;color:#fff;border-radius:8px;padding:13px;font-weight:900;font-size:16px;cursor:pointer;margin-top:5px}.submit:disabled{opacity:.6}.note{font-size:11px;color:#718096;margin:8px 0}.review{padding:11px 0;border-bottom:1px solid #edf0f4}.review:last-child{border-bottom:0}.review-head{display:flex;justify-content:space-between;gap:10px}.review-name{font-weight:800}.date{font-size:11px;color:#8a95a5}.review-stars{color:#f59e0b;margin:3px 0}.review-text{font-size:13px;color:#4b5a70;line-height:1.5}.review-imgs{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}.review-imgs img{width:70px;height:70px;object-fit:cover;border-radius:6px}.empty{text-align:center;color:#94a3b8;padding:20px}.status{display:none;margin:10px 0;padding:10px;border-radius:8px;font-size:13px;font-weight:700}.status.show{display:block}.status.ok{background:#eaf8ef;color:#087443}.status.err{background:#fff0f0;color:#b42318}@media(max-width:520px){.summary-grid{grid-template-columns:105px 1fr;gap:10px}.score strong{font-size:34px}.product img{width:78px;height:78px}.product h2{font-size:15px}.rating-select button{font-size:34px}}
</style>
</head>
<body>
<header class="top"><div class="top-in"><button class="back" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button><h1>⭐ रेटिंग और रिव्यू</h1></div></header>
<main class="wrap">
<section class="product"><img id="productImage" alt="Catalog"><div><h2 id="productName">कैटलॉग</h2><div class="model" id="productModel"></div></div></section>
<section class="summary"><h3>इस कार्ड की रेटिंग</h3><div class="summary-grid"><div class="score"><strong id="avg">0.0</strong><div class="stars" id="avgStars">☆☆☆☆☆</div><div class="count" id="total">0 Reviews</div></div><div class="bars" id="bars"></div></div></section>
<section class="form"><h3>अपनी रेटिंग दें</h3><div class="rating-select" id="ratingSelect"><button data-v="1">★</button><button data-v="2">★</button><button data-v="3">★</button><button data-v="4">★</button><button data-v="5">★</button></div><input id="name" placeholder="आपका नाम"><textarea id="text" placeholder="अपने अनुभव के बारे में लिखें..."></textarea><label class="upload"><i class="fa-solid fa-camera"></i> फोटो अपलोड करें (अधिकतम 5)<input id="images" type="file" accept="image/*" multiple></label><div class="previews" id="previews"></div><div class="note">यदि यह पेज My Orders से खोला गया है, तो आपकी रेटिंग उसी Order से जोड़ी जाएगी।</div><div class="status" id="status"></div><button class="submit" id="submit" onclick="saveRating()"><i class="fa-solid fa-paper-plane"></i> रेटिंग सबमिट करें</button></section>
<section class="reviews"><h3>ग्राहकों के रिव्यू <span id="reviewCount" style="color:#2874f0;font-size:13px">(0)</span></h3><div id="reviewList"><div class="empty">रिव्यू लोड हो रहे हैं...</div></div></section>
</main>
<script>
const SUPABASE_URL='https://qsvhtfkrlzclnqwypfdy.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzdmh0ZmtybHpjbG5xd3lwZmR5Iiwicm9sZCI6ImFub24iLCJpYXQiOjE3ODgyNDc3NjMsImV4cCI6MjEwMzgyMzc2M30.HLYUjfCK0w9d6C_-uPMFv-eAe6Cd_YkueSo--iHOUys';
let sb=null;try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){}
let ratingValue=0,catalogId='',orderDbId='',orderId='',context={},product=null,rows=[];
const q=new URLSearchParams(location.search);
const clean=v=>String(v??'').trim();
const norm=v=>clean(v).toLowerCase().replace(/\s+/g,' ');
const compact=v=>norm(v).replace(/[^a-z0-9\u0900-\u097f]+/g,'');
const modelKey=v=>norm(v).replace(/[^a-z0-9\u0900-\u097f]+/g,'');
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
function goBack(){if(history.length>1)history.back();else location.href='index.html'}
function stars(n){const x=Math.max(0,Math.min(5,Math.round(Number(n)||0)));return '★'.repeat(x)+'☆'.repeat(5-x)}
function getCtx(){try{context=JSON.parse(localStorage.getItem('dp_rating_order_context')||'{}')||{}}catch(e){context={}};if(!Object.keys(context).length){try{context=JSON.parse(localStorage.getItem('dp_rating_catalog_context')||'{}')||{}}catch(e){}};catalogId=clean(q.get('id')||context.catalog_id);orderDbId=clean(q.get('order_db_id')||context.order_db_id);orderId=clean(q.get('order_id')||context.order_id)}
async function resolveOrder(){if(!sb)return null;let o=null;try{if(orderDbId){const r=await sb.from('orders').select('*').eq('id',Number(orderDbId)).maybeSingle();if(!r.error&&r.data)o=r.data}}catch(e){}if(!o&&orderId){try{const r=await sb.from('orders').select('*').eq('order_id',orderId).maybeSingle();if(!r.error&&r.data)o=r.data}catch(e){}}if(o){orderDbId=clean(o.id);orderId=clean(o.order_id||orderId);context={...context,catalog_id:o.catalog_id||o.card_id||o.product_id||context.catalog_id,name:o.card_title||o.card_name||o.product_name||context.name,model:o.card_model||o.model||o.code||o.model_no||context.model,customer_name:o.customer_name||context.customer_name}}return o}
async function loadCatalog(){
 let rows=[];if(sb){try{const r=await sb.from('catalog').select('*').limit(1000);if(!r.error&&Array.isArray(r.data))rows=r.data}catch(e){}}
 if(!rows.length){try{const c=JSON.parse(localStorage.getItem('dp_index_catalog')||'[]');if(Array.isArray(c))rows=c}catch(e){}}
 const targetId=clean(catalogId),title=norm(context.name),model=norm(context.model);let best=null,score=-1;
 for(const c of rows){const cid=clean(c?.id??c?.catalog_id??c?.card_id),ct=norm(c?.name??c?.title??c?.card_name??c?.product_name),cm=norm(c?.model??c?.code??c?.card_model??c?.model_no);let s=0;if(targetId&&cid===targetId)s+=1000;if(title&&ct===title)s+=900;else if(title&&ct&&(title.includes(ct)||ct.includes(title)))s+=650;if(model&&cm===model)s+=180;if(s>score){score=s;best=c}}
 if(best){product=best;catalogId=clean(best.id??best.catalog_id??best.card_id)}else{product={id:catalogId,name:context.name||'कैटलॉग',model:context.model||'',image:context.image||''}}
 document.getElementById('productName').textContent=product.name||product.title||product.card_name||'कैटलॉग';document.getElementById('productModel').textContent=product.model||product.code||product.card_model||product.model_no||'';const img=product.image||product.image_url||product.photo||product.thumbnail||context.image||'';if(img)document.getElementById('productImage').src=img;else document.getElementById('productImage').style.display='none';
}
async function loadReviews(){
 rows=[];if(sb){try{const r=await sb.from('catalog_feedback').select('*').order('created_at',{ascending:false}).limit(2000);if(!r.error&&Array.isArray(r.data))rows=r.data}catch(e){}}
 // New standalone ratings always use real catalog_id. Legacy local records supplement only matching ID.
 try{const a=JSON.parse(localStorage.getItem('catalog_feedback_'+catalogId)||'[]');if(Array.isArray(a))rows.push(...a)}catch(e){}
 const seen=new Set();rows=rows.filter(r=>{const cid=clean(r?.catalog_id);if(cid&&cid===catalogId)return true;if(cid)return false;return false}).filter(r=>{const k=String(r?.id??'')+'|'+String(r?.order_db_id??r?.order_id??'')+'|'+String(r?.created_at??'')+'|'+String(r?.rating??r?.stars??'')+'|'+String(r?.name??r?.user_name??'');if(seen.has(k))return false;seen.add(k);return true});
 renderReviews();
}
function renderReviews(){const vals=rows.map(r=>Number(r?.rating??r?.stars??0)).filter(v=>v>=1&&v<=5),avg=vals.length?vals.reduce((a,v)=>a+v,0)/vals.length:0;document.getElementById('avg').textContent=avg?avg.toFixed(1):'0.0';document.getElementById('avgStars').textContent=stars(avg);document.getElementById('total').textContent=vals.length+' Reviews';document.getElementById('reviewCount').textContent='('+vals.length+')';let b='';for(let n=5;n>=1;n--){const c=vals.filter(v=>Math.round(v)===n).length;b+=`<div class="barrow"><span>${n}★</span><div class="track"><i class="fill" style="display:block;width:${vals.length?c/vals.length*100:0}%"></i></div><span>${c}</span></div>`}document.getElementById('bars').innerHTML=b;const box=document.getElementById('reviewList');if(!rows.length){box.innerHTML='<div class="empty">अभी कोई रिव्यू नहीं है।</div>';return}box.innerHTML=rows.slice(0,100).map(r=>{let imgs=r.review_images??r.images??r.image_urls??[];if(typeof imgs==='string'){try{imgs=JSON.parse(imgs)}catch(e){imgs=[]}}if(!Array.isArray(imgs))imgs=[];const im=imgs.filter(x=>typeof x==='string'&&/^https?:\/\//i.test(x)).map(x=>`<img src="${esc(x)}" alt="Review photo">`).join('');return `<div class="review"><div class="review-head"><span class="review-name">${esc(r.name||r.user_name||'ग्राहक')}</span><span class="date">${r.created_at?esc(new Date(r.created_at).toLocaleDateString('en-IN')):''}</span></div><div class="review-stars">${stars(r.rating||r.stars)}</div><div class="review-text">${esc(r.feedback||r.comment||'रेटिंग दी गई है।')}</div>${im?`<div class="review-imgs">${im}</div>`:''}</div>`}).join('')}
document.querySelectorAll('#ratingSelect button').forEach(b=>b.addEventListener('click',()=>{ratingValue=Number(b.dataset.v)||0;document.querySelectorAll('#ratingSelect button').forEach(x=>x.classList.toggle('on',Number(x.dataset.v)<=ratingValue))}));
document.getElementById('images').addEventListener('change',()=>{const box=document.getElementById('previews');box.innerHTML='';[...document.getElementById('images').files].slice(0,5).forEach(f=>{const u=URL.createObjectURL(f);const i=document.createElement('img');i.src=u;box.appendChild(i)})});
async function uploadImages(files){if(!sb)return[];const urls=[];for(const file of files.slice(0,5)){const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'').toLowerCase()||'jpg';const path=`ratings/${orderDbId||orderId||catalogId}/review_${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;try{const up=await sb.storage.from('review-images').upload(path,file,{upsert:false,contentType:file.type});if(up.error)continue;const p=sb.storage.from('review-images').getPublicUrl(path);if(p.data?.publicUrl)urls.push(p.data.publicUrl)}catch(e){}}return urls}
async function resolveCatalogId(){const supplied=clean(catalogId);if(supplied)return supplied;const o=await resolveOrder();if(o){catalogId=clean(o.catalog_id||o.card_id||o.product_id);if(catalogId)return catalogId;context={...context,name:o.card_title||o.card_name||o.product_name||'',model:o.card_model||o.model||o.code||o.model_no||''}}
 return catalogId}
function setStatus(msg,ok=false){const el=document.getElementById('status');el.textContent=msg;el.className='status show '+(ok?'ok':'err')}
async function saveRating(){if(!ratingValue){setStatus('कृपया 1 से 5 स्टार रेटिंग चुनें।');return}const btn=document.getElementById('submit');btn.disabled=true;setStatus('रेटिंग सेव की जा रही है...',true);try{await resolveCatalogId();if(!catalogId){setStatus('कैटलॉग की पहचान नहीं हो पाई। पहले कैटलॉग खोलकर फिर रेटिंग दें।');btn.disabled=false;return}if(!orderDbId&&orderId)await resolveOrder();const name=clean(document.getElementById('name').value)||clean(context.customer_name)||'ग्राहक';const text=clean(document.getElementById('text').value);const files=[...document.getElementById('images').files].slice(0,5);const imageUrls=await uploadImages(files);const row={catalog_id:String(catalogId),order_id:orderId?String(orderId):null,order_db_id:orderDbId?String(orderDbId):null,rating:ratingValue,stars:ratingValue,name,user_name:name,feedback:text,comment:text,review_images:imageUrls,created_at:new Date().toISOString()};
 if(!sb)throw new Error('Supabase connection उपलब्ध नहीं है।');
 let existing=null;if(orderDbId){const r=await sb.from('catalog_feedback').select('*').eq('order_db_id',String(orderDbId)).order('created_at',{ascending:false}).limit(1);if(!r.error&&r.data?.[0])existing=r.data[0]}if(!existing&&orderId){const r=await sb.from('catalog_feedback').select('*').eq('order_id',String(orderId)).order('created_at',{ascending:false}).limit(1);if(!r.error&&r.data?.[0])existing=r.data[0]}
 let saved=false;if(existing?.id!=null){const u=await sb.from('catalog_feedback').update(row).eq('id',existing.id);if(u.error)throw new Error(u.error.message||'पुरानी रेटिंग update नहीं हुई।');saved=true}else{const ins=await sb.from('catalog_feedback').insert(row);if(ins.error)throw new Error(ins.error.message||'रेटिंग save नहीं हुई।');saved=true}
 if(saved){try{const a=JSON.parse(localStorage.getItem('catalog_feedback_'+catalogId)||'[]');a.unshift(row);localStorage.setItem('catalog_feedback_'+catalogId,JSON.stringify(a.slice(0,100)))}catch(e){};try{localStorage.removeItem('dp_rating_order_context')}catch(e){};setStatus('आपकी रेटिंग और रिव्यू सफलतापूर्वक Supabase में सेव हो गया।',true);ratingValue=0;document.querySelectorAll('#ratingSelect button').forEach(x=>x.classList.remove('on'));document.getElementById('text').value='';document.getElementById('images').value='';await loadReviews()}
}catch(e){console.error(e);setStatus('रेटिंग सेव नहीं हुई: '+(e?.message||String(e))+'।');}finally{btn.disabled=false}}
(async()=>{getCtx();await resolveOrder();await loadCatalog();await loadReviews();})();
</script>
</body>
</html>
