<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>एडमिन पैनल - दिल्ली प्रेस</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #e63946;
            --primary-gradient: linear-gradient(135deg, #e63946 0%, #d62828 100%);
            --secondary: #f77f00;
            --dark: #0f172a;
            --light: #fdfbf7;
            --green: #10b981;
            --blue: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.94);
            --glass-border: rgba(255, 255, 255, 0.6);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 25px rgba(230, 57, 70, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', 'Poppins', sans-serif; }
        
        body {
            background-color: #0d1322;
            background-image: 
                radial-gradient(at 0% 0%, rgba(230, 57, 70, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.18) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(247, 127, 0, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #1e293b;
            line-height: 1.5;
            padding: 15px;
            padding-bottom: 60px;
            min-height: 100vh;
        }

        .top-nav-bar {
            max-width: 1250px; margin: 0 auto 16px auto;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(14px);
            padding: 12px 18px; border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .top-nav-bar a { text-decoration: none; color: #ffffff; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }

        .admin-card {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            max-width: 1250px; margin: 0 auto; border-radius: 16px;
            box-shadow: var(--card-shadow); padding: 22px;
            border: 1px solid var(--glass-border);
        }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 4px; color: #334155; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; background: #fff; }

        .admin-table-wrapper { width: 100%; overflow-x: auto; margin-top: 14px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; min-width: 850px; }
        .admin-table th, .admin-table td { border: 1px solid #e2e8f0; padding: 10px 8px; text-align: center; vertical-align: middle; }
        .admin-table th { background: #f8fafc; color: #0f172a; font-weight: 800; font-size: 13px; }

        .btn-del { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-view { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }

        .status-badge { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 15px; font-weight: 800; margin-bottom: 5px; }
        .status-pending { background: #fee2e2; color: #b91c1c; }
        .status-process { background: #fef3c7; color: #92400e; }
        .status-ready { background: #dcfce7; color: #15803d; }

        .stock-badge { display: inline-block; font-size: 11px; padding: 3px 9px; border-radius: 12px; font-weight: bold; }
        .in-stock { background: #dcfce7; color: #15803d; }
        .out-stock { background: #fee2e2; color: #b91c1c; }

        .btn-stock-toggle { border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; color: white; }

        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            flex: 1; min-width: 140px; padding: 12px 14px; background: #e2e8f0;
            color: #334155; border: none; border-radius: 10px; font-weight: 800;
            cursor: pointer; font-size: 13px;
        }
        .tab-btn.active { background: var(--primary-gradient); color: white; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px);
            display: none; justify-content: center; align-items: center; z-index: 9999; padding: 15px;
        }
        .modal-content {
            background: white; width: 100%; max-width: 700px; max-height: 92vh;
            border-radius: 14px; overflow-y: auto; padding: 22px; position: relative;
        }
        .receipt-container { border: 2px dashed #cbd5e1; padding: 20px; border-radius: 8px; background: #fff; }
        .receipt-header { text-align: center; border-bottom: 2px solid #1e293b; padding-bottom: 10px; margin-bottom: 14px; }
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; border-bottom: 1px dotted #e2e8f0; padding-bottom: 4px; }
        .receipt-section-title { background: #f8fafc; padding: 5px 10px; font-weight: 800; color: var(--primary); margin: 12px 0 8px 0; border-left: 3px solid var(--primary); font-size: 13px; }
    </style>
</head>
<body>

    <div class="top-nav-bar">
        <a href="index.html" style="font-size: 16px; color: #fff; font-weight:800;"><i class="fa-solid fa-print" style="color:var(--primary);"></i> <b>दिल्ली प्रेस एडमिन</b></a>
        <div style="display: flex; gap: 8px;">
            <a href="index.html" style="color:#fff;"><i class="fa-solid fa-house"></i> होम पेज</a>
        </div>
    </div>

    <div class="admin-card">
        <div id="adminPinSection" style="max-width: 380px; margin: 50px auto; text-align: center;">
            <div style="font-size: 46px; color: var(--primary); margin-bottom: 12px;"><i class="fa-solid fa-user-shield"></i></div>
            <h3 style="color: var(--dark); margin-bottom: 16px; font-weight:800;">दिल्ली प्रेस - एडमिन लॉगिन</h3>
            <div class="form-group" style="text-align: left;">
                <label>सुरक्षा पिन:</label>
                <input type="password" id="adminPin" placeholder="पिन दर्ज करें">
            </div>
            <button type="button" onclick="verifyAdminPin()" style="width: 100%; padding: 12px; background: var(--primary-gradient); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">प्रवेश करें</button>
        </div>

        <div id="adminDashboard" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 16px;">
                <h2 style="color: var(--primary); font-size: 22px; font-weight:800;">एडमिन डैशबोर्ड</h2>
                <button type="button" onclick="handleAdminLogout()" style="background: #e2e8f0; border: none; padding: 7px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">लॉगआउट</button>
            </div>

            <div class="nav-tabs">
                <button type="button" class="tab-btn active" id="tabBtnOrders" onclick="switchAdminTab('orders')"><i class="fa-solid fa-box-archive"></i> ग्राहक ऑर्डर्स (लाइव)</button>
                <button type="button" class="tab-btn" id="tabBtnCatalog" onclick="switchAdminTab('catalog')"><i class="fa-solid fa-images"></i> कैटलॉग व स्टॉक</button>
            </div>

            <!-- TAB 1: ORDERS -->
            <div id="tabOrdersSection">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h4 style="font-weight:800;">डेटाबेस से प्राप्त ग्राहक ऑर्डर्स</h4>
                    <button onclick="loadAdminOrders()" style="background:#f1f5f9; border:1px solid #cbd5e1; padding:5px 12px; border-radius:6px; font-size:12px; cursor:pointer; font-weight:bold;"><i class="fa-solid fa-arrows-rotate"></i> रिफ्रेश</button>
                </div>
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID / दिनांक</th>
                                <th>कार्ड विवरण</th>
                                <th>ग्राहक</th>
                                <th>वर-वधू</th>
                                <th>बिल / एडवांस</th>
                                <th>स्टेटस बदलें</th>
                                <th>रसीद</th>
                                <th>हटाएं</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 2: CATALOG -->
            <div id="tabCatalogSection" style="display: none;">
                <div style="background: #fdfaf6; border: 1px solid #fed7aa; padding: 16px; border-radius: 10px; margin-bottom: 18px;">
                    <h4 style="color: var(--secondary); margin-bottom: 12px; font-weight:800;">+ नया कार्ड जोड़ें</h4>
                    <form id="newCardForm" onsubmit="handleAddNewCatalogCard(event)">
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <div class="form-group" style="flex: 1; min-width: 150px;"><label>नाम:</label><input type="text" id="admCardName" required></div>
                            <div class="form-group" style="flex: 1; min-width: 150px;"><label>मॉडल:</label><input type="text" id="admCardModel" required></div>
                            <div class="form-group" style="width: 110px;"><label>रेट (₹):</label><input type="number" id="admCardRate" required></div>
                            <div class="form-group" style="width: 140px;">
                                <label>स्टॉक:</label>
                                <select id="admCardStock"><option value="true">उपलब्ध</option><option value="false">समाप्त</option></select>
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 160px;"><label>फोटो:</label><input type="file" id="admCardFile" accept="image/*" required></div>
                        </div>
                        <button type="submit" id="addCardSubmitBtn" style="padding: 10px 24px; background: var(--green); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">+ सुरक्षित करें</button>
                    </form>
                </div>
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead><tr><th>फोटो</th><th>नाम</th><th>मॉडल</th><th>रेट</th><th>स्टॉक</th><th>कार्रवाई</th><th>हटाएं</th></tr></thead>
                        <tbody id="catalogTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Receipt Modal -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 style="color:var(--primary); font-size:18px; font-weight:800;">ऑर्डर एवं सम्पूर्ण शादी मैटर रसीद</h3>
                <button type="button" onclick="closeOrderModal()" style="border:none; background:#e2e8f0; border-radius:50%; width:30px; height:30px; cursor:pointer; font-weight:bold;">&times;</button>
            </div>
            <div id="printableReceiptArea" class="receipt-container"></div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button type="button" onclick="downloadReceiptPDF()" style="flex:1; padding:11px; background:var(--green); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">PDF डाउनलोड</button>
                <button type="button" onclick="window.print()" style="flex:1; padding:11px; background:var(--dark); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">प्रिंट</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qsvhtfkrlzclnqwypfdy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdmh0ZmtybHpjbG5xd3lwZmR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDc3NjMsImV4cCI6MjEwMzgyMzc2M30.HLYUjfCK0w9d6C_-uPMFv-eAe6Cd_YkueSo--iHOUys";
        
        let supabaseClient = null;
        try {
            if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {}

        let globalOrdersCache = [];

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('dp_admin_auth') === 'true') showDashboard();
        });

        function verifyAdminPin() {
            const entered = document.getElementById('adminPin').value.trim();
            if (["1234", "9304", "815352"].includes(entered)) {
                sessionStorage.setItem('dp_admin_auth', 'true');
                showDashboard();
            } else {
                alert("गलत पिन!");
            }
        }

        function handleAdminLogout() {
            sessionStorage.removeItem('dp_admin_auth');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('adminPinSection').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadAdminOrders();
            loadCatalogStock();
        }

        function switchAdminTab(tab) {
            document.getElementById('tabOrdersSection').style.display = (tab === 'orders') ? 'block' : 'none';
            document.getElementById('tabCatalogSection').style.display = (tab === 'catalog') ? 'block' : 'none';
            document.getElementById('tabBtnOrders').classList.toggle('active', tab === 'orders');
            document.getElementById('tabBtnCatalog').classList.toggle('active', tab === 'catalog');
        }

        async function loadAdminOrders() {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '<tr><td colspan="8">डेटाबेस से ऑर्डर्स लोड हो रहे हैं...</td></tr>';

            if (!supabaseClient) {
                tbody.innerHTML = '<tr><td colspan="8" style="color:red;">डेटाबेस कनेक्ट नहीं है!</td></tr>';
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) {
                    tbody.innerHTML = `<tr><td colspan="8" style="color:red;">त्रुटि: ${error.message}</td></tr>`;
                    return;
                }

                globalOrdersCache = data || [];

                if (globalOrdersCache.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8">डेटाबेस में कोई ऑर्डर नहीं मिला।</td></tr>';
                    return;
                }

                tbody.innerHTML = globalOrdersCache.map(o => `
                    <tr>
                        <td>#${o.id}<br><small>${o.created_at ? new Date(o.created_at).toLocaleDateString('hi-IN') : ''}</small></td>
                        <td><b>${o.card_title || 'शादी कार्ड'}</b><br><small>${o.quantity || 100} पीस</small></td>
                        <td><b>${o.customer_name || '-'}</b><br>📞 ${o.mobile || '-'}</td>
                        <td>वर: ${o.groom_name || '-'}<br>वधू: ${o.bride_name || '-'}</td>
                        <td>कुल: ₹${o.total_amount || 0}<br>जमा: ₹${o.advance_paid || 0}</td>
                        <td>
                            <select onchange="updateOrderStatus('${o.id}', this.value)" style="padding:4px; font-weight:bold;">
                                <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                                <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                                <option value="Ready" ${o.status === 'Ready' ? 'selected' : ''}>Ready</option>
                            </select>
                        </td>
                        <td><button class="btn-view" onclick="openOrderReceiptModal('${o.id}')">रसीद</button></td>
                        <td><button class="btn-del" onclick="deleteAdminOrder('${o.id}')"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="8" style="color:red;">नेटवर्क त्रुटि: ${err.message}</td></tr>`;
            }
        }

        async function updateOrderStatus(id, newStatus) {
            if (!supabaseClient) return;
            try {
                const { error } = await supabaseClient
                    .from('orders')
                    .update({ status: newStatus })
                    .eq('id', Number(id));

                if (error) alert("स्टेटस अपडेट नहीं हो सका: " + error.message);
            } catch (e) {
                alert("नेटवर्क त्रुटि!");
            }
        }

        async function deleteAdminOrder(id) {
            if (!confirm("क्या आप वाकई इस ऑर्डर को डेटाबेस से हटाना चाहते हैं?")) return;
            if (!supabaseClient) return;
            try {
                const { error } = await supabaseClient
                    .from('orders')
                    .delete()
                    .eq('id', Number(id));

                if (error) alert("ऑर्डर डिलीट नहीं हो सका: " + error.message);
                loadAdminOrders();
            } catch (e) {
                alert("नेटवर्क त्रुटि!");
            }
        }

        function openOrderReceiptModal(id) {
            const o = globalOrdersCache.find(x => String(x.id) === String(id));
            if (!o) return;

            // Payment Receipt / Screenshot Image Preview
            let receiptPicHtml = '';
            if (o.payment_receipt && o.payment_receipt.trim() !== '') {
                receiptPicHtml = `
                    <div style="margin-top:14px; padding:10px; background:#f8fafc; border:1.5px dashed #cbd5e1; border-radius:8px; text-align:center;">
                        <div style="font-weight:bold; color:#1e293b; margin-bottom:6px; font-size:13px;">
                            <i class="fa-solid fa-image" style="color:var(--primary);"></i> ग्राहक द्वारा भेजी गई भुगतान रसीद / स्क्रीनशॉट:
                        </div>
                        <a href="${o.payment_receipt}" target="_blank" title="बड़ा देखने के लिए क्लिक करें">
                            <img src="${o.payment_receipt}" style="max-width:100%; max-height:280px; border-radius:6px; border:1px solid #cbd5e1; box-shadow:0 2px 8px rgba(0,0,0,0.1); display:inline-block; margin-top:4px;">
                        </a>
                        <p style="font-size:11px; color:#64748b; margin-top:4px;">(फ़ोटो को पूरा बड़ा देखने के लिए उस पर क्लिक करें)</p>
                    </div>
                `;
            } else {
                receiptPicHtml = `
                    <div style="margin-top:10px; font-size:12px; color:#64748b; font-style:italic;">
                        कोई रसीद संलग्न नहीं है (COD या बिना स्क्रीनशॉट का भुगतान)।
                    </div>
                `;
            }

            document.getElementById('printableReceiptArea').innerHTML = `
                <div class="receipt-header">
                    <h2 style="color:var(--primary); margin:0;">दिल्ली प्रेस (सज्जाद प्रिंटर्स)</h2>
                    <p style="font-size:11px; margin:0;">ईदगाह मोड़, करमाटांड़, जामताड़ा | मो: 9304509464</p>
                </div>
                <div class="receipt-row"><span><b>ऑर्डर ID:</b></span><b>#${o.id}</b></div>
                <div class="receipt-row"><span><b>दिनांक:</b></span><span>${o.created_at ? new Date(o.created_at).toLocaleDateString('hi-IN') : 'हाल ही में'}</span></div>
                <div class="receipt-row"><span><b>ग्राहक नाम:</b></span><b>${o.customer_name || '-'}</b></div>
                <div class="receipt-row"><span><b>मोबाइल:</b></span><b>${o.mobile || '-'}</b></div>
                <div class="receipt-row"><span><b>पता:</b></span><b>${o.address || '-'}</b></div>
                
                <div class="receipt-section-title">शादी मैटर विवरण</div>
                <div class="receipt-row"><span><b>वर (दूल्हा):</b></span><b style="color:var(--primary);">${o.groom_name || '-'} (पिता: ${o.groom_father || '-'})</b></div>
                <div class="receipt-row"><span><b>वर का पता:</b></span><span>${o.groom_address || '-'}</span></div>
                <div class="receipt-row"><span><b>वधू (दुल्हन):</b></span><b style="color:var(--secondary);">${o.bride_name || '-'} (पिता: ${o.bride_father || '-'})</b></div>
                <div class="receipt-row"><span><b>वधू का पता:</b></span><span>${o.bride_address || '-'}</span></div>
                <div style="font-size:12px; background:#f8fafc; padding:8px; margin:6px 0; border:1px solid #eee; white-space:pre-wrap; border-radius:4px;"><b>विवरण / शायरी / कार्यक्रम:</b><br>${o.custom_notes || 'कोई मैटर नहीं'}</div>
                
                <div class="receipt-section-title">बिल एवं भुगतान विवरण</div>
                <div class="receipt-row"><span>संख्या:</span><b>${o.quantity || 100} पीस</b></div>
                <div class="receipt-row"><span>कुल बिल राशि:</span><b>₹${o.total_amount || 0}</b></div>
                <div class="receipt-row"><span>जमा एडवांस राशि:</span><b style="color:green;">₹${o.advance_paid || 0}</b></div>
                <div class="receipt-row"><span>बाकी बकाया राशि:</span><b style="color:red;">₹${o.balance_amount || 0}</b></div>
                <div class="receipt-row"><span>भुगतान मोड:</span><b>${o.payment_mode || '-'}</b></div>
                <div class="receipt-row"><span>UTR / Ref No:</span><b>${o.txn_id || '-'}</b></div>
                
                ${receiptPicHtml}
            `;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; }

        function downloadReceiptPDF() {
            const element = document.getElementById('printableReceiptArea');
            html2pdf().set({ margin: 6, filename: 'DelhiPress_Receipt.pdf', html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } }).from(element).save();
        }

        async function loadCatalogStock() {
            const tbody = document.getElementById('catalogTableBody');
            tbody.innerHTML = '<tr><td colspan="7">कैटलॉग लोड हो रहा है...</td></tr>';
            if (!supabaseClient) return;

            try {
                const { data, error } = await supabaseClient
                    .from('catalog')
                    .select('*')
                    .order('id', { ascending: false });

                if (error || !data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7">डेटाबेस में कोई कार्ड नहीं मिला। ऊपर दिए फॉर्म से जोड़ें।</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(c => `
                    <tr>
                        <td><img src="${c.image || ''}" style="width:45px;height:45px;object-fit:cover;border-radius:4px;"></td>
                        <td><b>${c.name}</b></td>
                        <td>${c.model}</td>
                        <td>₹${c.rate}</td>
                        <td><span class="stock-badge ${c.in_stock ? 'in-stock' : 'out-stock'}">${c.in_stock ? 'उपलब्ध' : 'समाप्त'}</span></td>
                        <td><button class="btn-stock-toggle" style="background:${c.in_stock ? '#f77f00' : '#10b981'}" onclick="toggleCardStock('${c.id}', ${!c.in_stock})">${c.in_stock ? 'Out करें' : 'In करें'}</button></td>
                        <td><button class="btn-del" onclick="deleteCatalogCard('${c.id}')"><i class="fa-solid fa-trash"></i></button></td>
                    </tr>
                `).join('');
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="7">कैटलॉग लोड नहीं हो सका।</td></tr>';
            }
        }

        function compressCardImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const max = 700;
                        let w = img.width, h = img.height;
                        if (w > h && w > max) { h = Math.round((h * max) / w); w = max; }
                        else if (h > max) { w = Math.round((w * max) / h); h = max; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        async function handleAddNewCatalogCard(e) {
            e.preventDefault();
            const btn = document.getElementById('addCardSubmitBtn');
            btn.innerText = "अपलोड हो रहा है...";
            btn.disabled = true;

            const name = document.getElementById('admCardName').value.trim();
            const model = document.getElementById('admCardModel').value.trim();
            const rate = parseFloat(document.getElementById('admCardRate').value) || 0;
            const in_stock = document.getElementById('admCardStock').value === 'true';
            const file = document.getElementById('admCardFile').files[0];

            let finalImage = "https://kommodo.ai/i/AjEZMpWkUkG0POxk0HVQ";
            if (file) finalImage = await compressCardImage(file);

            const payload = { name, model, rate, in_stock, image: finalImage, created_at: new Date().toISOString() };

            if (supabaseClient) {
                const { error } = await supabaseClient.from('catalog').insert([payload]);
                if (error) alert("कार्ड डेटाबेस में सेव नहीं हुआ: " + error.message);
                else alert("कार्ड डेटाबेस में जुड़ गया!");
            }

            btn.innerText = "+ सुरक्षित करें";
            btn.disabled = false;
            document.getElementById('newCardForm').reset();
            loadCatalogStock();
        }

        async function toggleCardStock(id, newStatus) {
            if (supabaseClient) {
                await supabaseClient.from('catalog').update({ in_stock: newStatus }).eq('id', Number(id));
                loadCatalogStock();
            }
        }

        async function deleteCatalogCard(id) {
            if (!confirm("क्या आप वाकई इस कार्ड को हटाना चाहते हैं?")) return;
            if (supabaseClient) {
                await supabaseClient.from('catalog').delete().eq('id', Number(id));
                loadCatalogStock();
            }
        }
    </script>
</body>
</html>
