<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>एडमिन पैनल - दिल्ली प्रेस</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --primary: #e63946;
            --primary-gradient: linear-gradient(135deg, #e63946 0%, #d62828 100%);
            --secondary: #f77f00;
            --dark: #0f172a;
            --light: #fdfbf7;
            --green: #10b981;
            --blue: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.94);
            --glass-border: rgba(255, 255, 255, 0.6);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 25px rgba(230, 57, 70, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', 'Poppins', sans-serif; }
        
        body {
            background-color: #0d1322;
            background-image: 
                radial-gradient(at 0% 0%, rgba(230, 57, 70, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.18) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(247, 127, 0, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #1e293b;
            line-height: 1.5;
            padding: 12px;
            padding-bottom: 70px;
            min-height: 100vh;
        }

        .top-nav-bar {
            max-width: 1250px; margin: 0 auto 14px auto;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(14px);
            padding: 12px 18px; border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .top-nav-bar a { text-decoration: none; color: #ffffff; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }

        .admin-card {
            background: var(--glass-bg); backdrop-filter: blur(20px);
            max-width: 1250px; margin: 0 auto; border-radius: 20px;
            box-shadow: var(--card-shadow); padding: 22px;
            border: 1px solid var(--glass-border);
        }

        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 4px; color: #334155; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; background: #fff; }

        .admin-table-wrapper { width: 100%; overflow-x: auto; margin-top: 14px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; min-width: 1100px; }
        .admin-table th, .admin-table td { border: 1px solid #e2e8f0; padding: 10px 8px; text-align: center; vertical-align: middle; }
        .admin-table th { background: #f8fafc; color: #0f172a; font-weight: 800; font-size: 13px; }

        .btn-del { background: #ef4444; color: white; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-view { background: linear-gradient(135deg, #059669, #10b981); color: white; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; }

        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn {
            flex: 1; min-width: 140px; padding: 12px 14px; background: #e2e8f0;
            color: #334155; border: none; border-radius: 10px; font-weight: 800;
            cursor: pointer; font-size: 13px;
        }
        .tab-btn.active { background: var(--primary-gradient); color: white; box-shadow: 0 8px 20px rgba(230,57,70,.25); }

        /* MODAL STYLING */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px);
            display: none; justify-content: center; align-items: center; z-index: 9999; padding: 12px;
        }
        .modal-content {
            background: white; width: 100%; max-width: 850px; max-height: 94vh;
            border-radius: 16px; overflow-y: auto; padding: 20px; position: relative;
        }

        /* PRINTABLE RECEIPT WITH SEPARATE WELL-DEFINED TABLES */
        .receipt-container { 
            border: 2px solid #0f172a; 
            padding: 20px; 
            border-radius: 10px; 
            background: #fff;
            color: #0f172a;
        }
        .receipt-header { 
            text-align: center; 
            border-bottom: 2px dashed #0f172a; 
            padding-bottom: 12px; 
            margin-bottom: 16px; 
        }
        .receipt-header h2 { font-size: 24px; font-weight: 900; color: #dc2626; letter-spacing: 0.5px; }
        .receipt-header p { font-size: 12px; color: #475569; font-weight: 600; }

        .receipt-card-block {
            display: flex;
            gap: 16px;
            align-items: center;
            background: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            margin-bottom: 16px;
        }
        .receipt-card-block img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #94a3b8;
            background: #fff;
        }

        /* CLEAR DISTINCT TABLES */
        .r-table-title {
            font-size: 13px;
            font-weight: 800;
            background: #0f172a;
            color: #ffffff;
            padding: 6px 10px;
            border-radius: 6px 6px 0 0;
            margin-top: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .r-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 12px;
            background: #ffffff;
        }
        .r-table th, .r-table td {
            border: 1px solid #334155;
            padding: 8px 10px;
            font-size: 12px;
            text-align: left;
            vertical-align: top;
        }
        .r-table th {
            background: #f1f5f9;
            color: #0f172a;
            font-weight: 800;
            white-space: nowrap;
        }
        .r-table td {
            word-break: break-word;
            line-height: 1.6;
        }

        .karyakram-table th { background: #fee2e2; color: #991b1b; text-align: center; font-weight: 800; }
        .karyakram-table td { text-align: center; font-weight: 600; }

        .receipt-screenshot-box {
            text-align: center;
            background: #f8fafc;
            border: 1px dashed #64748b;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }
        .receipt-screenshot-box img {
            max-width: 250px;
            max-height: 280px;
            border-radius: 6px;
            border: 1px solid #475569;
        }

        @media print {
            body * { visibility: hidden; }
            #printableReceiptArea, #printableReceiptArea * { visibility: visible; }
            #printableReceiptArea {
                position: absolute; left: 0; top: 0; width: 100%; border: none; padding: 0;
            }
        }
    </style>
</head>
<body>

    <div class="top-nav-bar">
        <a href="index.html" style="font-size: 16px; color: #fff; font-weight:800;">
            <i class="fa-solid fa-print" style="color:var(--primary);"></i> <b>दिल्ली प्रेस एडमिन</b>
        </a>
        <a href="index.html"><i class="fa-solid fa-house"></i> होम पेज</a>
    </div>

    <div class="admin-card">
        <div id="adminPinSection" style="max-width: 380px; margin: 50px auto; text-align: center;">
            <div style="font-size: 46px; color: var(--primary); margin-bottom: 12px;"><i class="fa-solid fa-user-shield"></i></div>
            <h3 style="color: var(--dark); margin-bottom: 16px; font-weight:800;">दिल्ली प्रेस - एडमिन लॉगिन</h3>
            <div class="form-group" style="text-align: left;">
                <label>सुरक्षा पिन:</label>
                <input type="password" id="adminPin" placeholder="पिन दर्ज करें">
            </div>
            <button type="button" onclick="verifyAdminPin()" style="width: 100%; padding: 12px; background: var(--primary-gradient); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">प्रवेश करें</button>
        </div>

        <div id="adminDashboard" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 12px; margin-bottom: 16px;">
                <h2 style="color: var(--primary); font-size: 22px; font-weight:800;">एडमिन डैशबोर्ड</h2>
                <button type="button" onclick="handleAdminLogout()" style="background: #e2e8f0; border: none; padding: 7px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">लॉगआउट</button>
            </div>

            <div class="nav-tabs">
                <button type="button" class="tab-btn active" id="tabBtnOrders" onclick="switchAdminTab('orders')"><i class="fa-solid fa-box-archive"></i> ग्राहक ऑर्डर्स</button>
                <button type="button" class="tab-btn" id="tabBtnCatalog" onclick="switchAdminTab('catalog')"><i class="fa-solid fa-images"></i> कैटलॉग</button>
                <button type="button" class="tab-btn" id="tabBtnAnalytics" onclick="switchAdminTab('analytics')"><i class="fa-solid fa-chart-line"></i> ग्राफ़</button>
            </div>

            <!-- TAB 1: ORDERS -->
            <div id="tabOrdersSection">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h4 style="font-weight:800;">डेटाबेस से प्राप्त ग्राहक ऑर्डर्स</h4>
                    <button onclick="loadAdminOrders()" style="background:#f1f5f9; border:1px solid #cbd5e1; padding:6px 14px; border-radius:6px; font-size:12px; cursor:pointer; font-weight:bold;"><i class="fa-solid fa-arrows-rotate"></i> रिफ्रेश</button>
                </div>
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID / दिनांक</th>
                                <th>कार्ड विवरण</th>
                                <th>ग्राहक</th>
                                <th>वर-वधू</th>
                                <th>बिल / एडवांस</th>
                                <th>पेमेंट मोड</th>
                                <th>स्टेटस</th>
                                <th>रसीद (Receipt)</th>
                                <th>हटाएं</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 2: CATALOG -->
            <div id="tabCatalogSection" style="display: none;">
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead><tr><th>फोटो</th><th>नाम</th><th>मॉडल</th><th>रेट</th><th>स्टॉक</th><th>हटाएं</th></tr></thead>
                        <tbody id="catalogTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- TAB 3: CUSTOMER ANALYTICS -->
            <div id="tabAnalyticsSection" style="display: none;">
                <h4 style="margin-bottom:12px; font-weight:800;">ग्राहक विश्लेषण</h4>
                <div style="position: relative; height: 280px; width: 100%; background:#fff; padding:15px; border-radius:12px; border:1px solid #e2e8f0;">
                    <canvas id="customerChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- POORA DETAILED SEPARATE TABLE RECEIPT MODAL -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 style="color:var(--primary); font-size:18px; font-weight:800;"><i class="fa-solid fa-receipt"></i> शादी मैटर व संपूर्ण टेबल रसीद</h3>
                <button type="button" onclick="closeOrderModal()" style="border:none; background:#e2e8f0; border-radius:50%; width:30px; height:30px; cursor:pointer; font-weight:bold;">&times;</button>
            </div>
            
            <div id="printableReceiptArea" class="receipt-container"></div>
            
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button type="button" onclick="downloadReceiptPDF()" style="flex:1; padding:11px; background:var(--green); color:white; border: none; border-radius:6px; font-weight:bold; cursor:pointer;"><i class="fa-solid fa-file-pdf"></i> PDF डाउनलोड</button>
                <button type="button" onclick="window.print()" style="flex:1; padding:11px; background:var(--dark); color:white; border: none; border-radius:6px; font-weight:bold; cursor:pointer;"><i class="fa-solid fa-print"></i> प्रिंट</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://qsvhtfkrlzclnqwypfdy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdmh0ZmtybHpjbG5xd3lwZmR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDc3NjMsImV4cCI6MjEwMzgyMzc2M30.HLYUjfCK0w9d6C_-uPMFv-eAe6Cd_YkueSo--iHOUys";
        
        let supabaseClient = null;
        try {
            if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {}

        let globalOrdersCache = [];

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('dp_admin_auth') === 'true') showDashboard();
        });

        function verifyAdminPin() {
            const entered = document.getElementById('adminPin').value.trim();
            if (["1234", "9304", "815352"].includes(entered)) {
                sessionStorage.setItem('dp_admin_auth', 'true');
                showDashboard();
            } else {
                alert("गलत पिन!");
            }
        }

        function handleAdminLogout() {
            sessionStorage.removeItem('dp_admin_auth');
            location.reload();
        }

        function showDashboard() {
            document.getElementById('adminPinSection').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
            loadAdminOrders();
            loadCatalogStock();
        }

        function switchAdminTab(tab) {
            document.getElementById('tabOrdersSection').style.display = (tab === 'orders') ? 'block' : 'none';
            document.getElementById('tabCatalogSection').style.display = (tab === 'catalog') ? 'block' : 'none';
            document.getElementById('tabAnalyticsSection').style.display = (tab === 'analytics') ? 'block' : 'none';

            document.getElementById('tabBtnOrders').classList.toggle('active', tab === 'orders');
            document.getElementById('tabBtnCatalog').classList.toggle('active', tab === 'catalog');
            document.getElementById('tabBtnAnalytics').classList.toggle('active', tab === 'analytics');
        }

        async function loadAdminOrders() {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '<tr><td colspan="9">डेटाबेस से लोड हो रहा है...</td></tr>';

            let localOrders = [];
            try {
                localOrders = JSON.parse(localStorage.getItem('dp_all_orders') || localStorage.getItem('my_orders_list') || '[]');
            } catch (e) {}

            if (!supabaseClient) {
                renderOrdersTable(localOrders);
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('orders')
                    .select('*')
                    .order('id', { ascending: false });

                if (!error && data && data.length > 0) {
                    globalOrdersCache = data;
                } else {
                    globalOrdersCache = localOrders;
                }
                renderOrdersTable(globalOrdersCache);
            } catch (err) {
                renderOrdersTable(localOrders);
            }
        }

        function renderOrdersTable(orders) {
            const tbody = document.getElementById('ordersTableBody');
            if (!orders || orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9">कोई ऑर्डर उपलब्ध नहीं है।</td></tr>';
                return;
            }

            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td>#${o.id || o.order_id || '-'}<br><small>${o.created_at ? new Date(o.created_at).toLocaleDateString('hi-IN') : '-'}</small></td>
                    <td><b>${o.card_title || o.card_name || 'शादी कार्ड'}</b><br><small>${o.quantity || o.qty || 100} पीस</small></td>
                    <td><b>${o.customer_name || o.name || '-'}</b><br>📞 ${o.mobile || o.phone || '-'}<br><small>${o.address || ''}</small></td>
                    <td>वर: <b>${o.groom_name || o.groom || '-'}</b><br>वधू: <b>${o.bride_name || o.bride || '-'}</b></td>
                    <td>कुल: ₹${o.total_amount || 0}<br><span style="color:var(--green); font-weight:bold;">जमा: ₹${o.advance_paid || o.advance_amount || 0}</span></td>
                    <td><span style="font-weight:bold; font-size:11px;">${o.payment_mode || 'Online'}</span></td>
                    <td><b>${o.status || 'Pending'}</b></td>
                    <td><button class="btn-view" onclick="openOrderReceiptModal('${o.id}')"><i class="fa-solid fa-eye"></i> रसीद</button></td>
                    <td><button class="btn-del" onclick="deleteAdminOrder('${o.id}')"><i class="fa-solid fa-trash"></i></button></td>
                </tr>
            `).join('');
        }

        /* HAR KARYAKRAM AUR VIVARAN KE LIYE SARE DISTINCT TABLES */
        function openOrderReceiptModal(orderId) {
            const o = globalOrdersCache.find(x => String(x.id) === String(orderId)) || {};
            
            const cardImg = o.card_image || o.image || o.card_photo || '';
            const receiptImg = o.payment_receipt || o.screenshot || '';
            const total = parseFloat(o.total_amount || 0);
            const adv = parseFloat(o.advance_paid || o.advance_amount || 0);
            const bal = total - adv;

            // Karyakram Parsing (Safe Fallbacks)
            const mandaDate = o.manda_date || o.date_manda || '-';
            const tilakDate = o.tilak_date || o.date_tilak || '-';
            const haldiDate = o.haldi_date || o.date_haldi || '-';
            const baratDate = o.barat_date || o.wedding_date || o.function_date || '-';
            const vidaiDate = o.vidai_date || o.date_vidai || '-';

            // Parivar / Relatives
            const darshanabhilashi = o.darshan_abhilashi || o.darshanabhilashi || o.darshan || 'समस्त सगे संबंधी एवं मित्रगण';
            const nivedak = o.nivedak || o.nivedak_name || `${o.groom_father || o.bride_father || ''} एवं समस्त परिवार`;
            const adai = o.adai || o.bal_aagrah || o.bal_aakankshi || o.adai_names || 'समस्त बच्चे एवं परिवारजन';

            const area = document.getElementById('printableReceiptArea');
            area.innerHTML = `
                <div class="receipt-header">
                    <h2>दिल्ली प्रेस (सज्जाद प्रिंटर्स)</h2>
                    <p>शादी कार्ड, निमंत्रण पत्र, फ्लेक्स बैनर एवं ऑफसेट प्रिंटिंग सेवा</p>
                    <p style="font-size:11px; margin-top:4px; color:#64748b;">
                        <b>रसीद सं.:</b> #${o.order_id || o.id || 'DP-' + Date.now()} &nbsp;|&nbsp; 
                        <b>बुकिंग तिथि:</b> ${o.created_at ? new Date(o.created_at).toLocaleDateString('hi-IN') : new Date().toLocaleDateString('hi-IN')}
                    </p>
                </div>

                <!-- 1. CHOSEN CARD TABLE -->
                <div class="receipt-card-block">
                    <img src="${cardImg || 'https://via.placeholder.com/100?text=Card'}" alt="Card" onerror="this.src='https://via.placeholder.com/100?text=Card';">
                    <div style="flex:1;">
                        <h4 style="font-size:16px; font-weight:800; color:#0f172a;">${o.card_title || o.card_name || 'शादी कार्ड'}</h4>
                        <div style="font-size:12px; margin-top:3px;">मॉडल संख्या: <b>${o.card_model || o.model || 'Standard'}</b></div>
                        <div style="font-size:12px; margin-top:2px;">कुल प्रिंटिंग मात्रा: <b style="color:var(--blue); font-size:14px;">${o.quantity || o.qty || 100} पीस</b></div>
                    </div>
                </div>

                <!-- 2. GRAHAK INFO TABLE -->
                <div class="r-table-title"><i class="fa-solid fa-user-tag"></i> 1. ग्राहक विवरण (Customer Info)</div>
                <table class="r-table">
                    <tr>
                        <th style="width:25%;">ग्राहक का नाम</th>
                        <td style="width:25%;"><b>${o.customer_name || o.name || '-'}</b></td>
                        <th style="width:25%;">मोबाइल नंबर</th>
                        <td style="width:25%;"><b>${o.mobile || o.phone || '-'}</b></td>
                    </tr>
                    <tr>
                        <th>पूरा पता</th>
                        <td colspan="3">${o.address || o.customer_address || '-'}</td>
                    </tr>
                </table>

                <!-- 3. VAR-VADHU DETAILS TABLE -->
                <div class="r-table-title" style="background:#b91c1c;"><i class="fa-solid fa-heart"></i> 2. वर एवं वधू विवरण (दूल्हा-दुल्हन पक्ष)</div>
                <table class="r-table">
                    <tr>
                        <th style="width:20%; background:#dbeafe; color:#1e3a8a;">वर (लड़का)</th>
                        <td style="width:30%; font-size:14px; font-weight:bold; color:#1e3a8a;">${o.groom_name || o.groom || '-'}</td>
                        <th style="width:20%; background:#fce7f3; color:#9d174d;">वधू (लड़की)</th>
                        <td style="width:30%; font-size:14px; font-weight:bold; color:#9d174d;">${o.bride_name || o.bride || '-'}</td>
                    </tr>
                    <tr>
                        <th>वर के पिता</th>
                        <td>${o.groom_father || o.g_father || '-'}</td>
                        <th>वधू के पिता</th>
                        <td>${o.bride_father || o.b_father || '-'}</td>
                    </tr>
                    <tr>
                        <th>वर का निवास पता</th>
                        <td>${o.groom_address || o.g_address || '-'}</td>
                        <th>वधू का निवास पता</th>
                        <td>${o.bride_address || o.b_address || '-'}</td>
                    </tr>
                </table>

                <!-- 4. HAR KARYAKRAM TABLE -->
                <div class="r-table-title" style="background:#c2410c;"><i class="fa-solid fa-calendar-days"></i> 3. वैवाहिक मांगलिक कार्यक्रम (शुभ तिथियाँ)</div>
                <table class="r-table karyakram-table">
                    <thead>
                        <tr>
                            <th>मांडा / मटकोर</th>
                            <th>तिलक / फलदान</th>
                            <th>हल्दी / मेंहदी</th>
                            <th>शुभ विवाह / बारात</th>
                            <th>विदाई / प्रीतिभोज</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>${mandaDate}</td>
                            <td>${tilakDate}</td>
                            <td>${haldiDate}</td>
                            <td style="color:#b91c1c; font-weight:800; font-size:13px;">${baratDate}</td>
                            <td>${vidaiDate}</td>
                        </tr>
                    </tbody>
                </table>

                <!-- 5. DARSHANABHILASHI, NIVEDAK & ADAI TABLES -->
                <div class="r-table-title" style="background:#0f766e;"><i class="fa-solid fa-users"></i> 4. दर्शनाभिलाषी, निवेदक एवं आकांक्षी (Distinct Blocks)</div>
                <table class="r-table">
                    <tr>
                        <th style="width:25%;">दर्शनाभिलाषी</th>
                        <td style="font-weight:600;">${darshanabhilashi}</td>
                    </tr>
                    <tr>
                        <th>निवेदक</th>
                        <td style="font-weight:700; color:#b91c1c;">${nivedak}</td>
                    </tr>
                    <tr>
                        <th>आदई / बाल आकांक्षी</th>
                        <td style="font-weight:600; color:#0f766e;">${adai}</td>
                    </tr>
                    ${(o.custom_notes || o.matter_text) ? `
                    <tr>
                        <th>अन्य शायरी / मैटर</th>
                        <td style="white-space:pre-wrap; font-weight:600;">${o.custom_notes || o.matter_text}</td>
                    </tr>` : ''}
                </table>

                <!-- 6. BILLING TABLE -->
                <div class="r-table-title" style="background:#15803d;"><i class="fa-solid fa-indian-rupee-sign"></i> 5. बिल व भुगतान विवरण</div>
                <table class="r-table">
                    <tr>
                        <th style="width:25%;">कुल बिल राशि</th>
                        <td style="width:25%; font-size:14px; font-weight:800;">₹${total}</td>
                        <th style="width:25%;">जमा एडवांस राशि</th>
                        <td style="width:25%; color:#15803d; font-size:14px; font-weight:800;">₹${adv}</td>
                    </tr>
                    <tr>
                        <th>बकाया राशि (Balance)</th>
                        <td style="color:#dc2626; font-size:14px; font-weight:800;">₹${bal >= 0 ? bal : 0}</td>
                        <th>भुगतान माध्यम</th>
                        <td><b>${o.payment_mode || 'Online (UPI)'}</b></td>
                    </tr>
                    <tr>
                        <th>UTR / Transaction Ref No</th>
                        <td colspan="3"><code style="background:#f1f5f9; padding:2px 8px; font-weight:bold; font-size:13px;">${o.txn_id || o.utr_number || 'उपलब्ध नहीं'}</code></td>
                    </tr>
                </table>

                <!-- 7. PAYMENT RECEIPT SCREENSHOT -->
                <div class="r-table-title" style="background:#475569;"><i class="fa-solid fa-image"></i> 6. ग्राहक द्वारा अपलोड भुगतान प्रमाण (Screenshot)</div>
                <div class="receipt-screenshot-box">
                    ${receiptImg ? `
                        <img src="${receiptImg}" alt="Payment Proof">
                        <div style="margin-top:6px;">
                            <a href="${receiptImg}" target="_blank" download="Receipt_${o.id}.jpg" style="font-size:12px; font-weight:bold; color:var(--blue); text-decoration:none;">
                                <i class="fa-solid fa-download"></i> ओरिजिनल स्क्रीनशॉट डाउनलोड करें
                            </a>
                        </div>
                    ` : `
                        <p style="color:#64748b; font-size:12px;">कोई स्क्रीनशॉट अपलोड नहीं किया गया है।</p>
                    `}
                </div>
            `;

            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeOrderModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function downloadReceiptPDF() {
            const element = document.getElementById('printableReceiptArea');
            const opt = {
                margin: 4,
                filename: `Delhi_Press_Receipt_${Date.now()}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        async function deleteAdminOrder(id) {
            if (!confirm("क्या आप वाकई इस ऑर्डर को हटाना चाहते हैं?")) return;
            if (supabaseClient) {
                try {
                    await supabaseClient.from('orders').delete().eq('id', Number(id));
                } catch (e) {}
            }
            loadAdminOrders();
        }

        async function loadCatalogStock() {
            const tbody = document.getElementById('catalogTableBody');
            if (!tbody || !supabaseClient) return;
            try {
                const { data } = await supabaseClient.from('catalog').select('*').order('id', { ascending: false });
                if (data) {
                    tbody.innerHTML = data.map(c => `
                        <tr>
                            <td><img src="${c.image || 'https://via.placeholder.com/45'}" style="width:45px; height:45px; object-fit:cover; border-radius:6px;"></td>
                            <td><b>${c.name || '-'}</b></td>
                            <td>${c.model || '-'}</td>
                            <td><b>₹${c.rate || c.price || 0}</b></td>
                            <td><span>${c.in_stock ? 'उपलब्ध' : 'समाप्त'}</span></td>
                            <td><button class="btn-del" onclick="deleteCatalogCard('${c.id}')"><i class="fa-solid fa-trash"></i></button></td>
                        </tr>
                    `).join('');
                }
            } catch (e) {}
        }
    </script>
</body>
</html>
