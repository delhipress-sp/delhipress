<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>एडमिन पैनल - दिल्ली प्रेस</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0d1322; color: #fff; font-family: 'Mukta', sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; color: #333; padding: 20px; border-radius: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; font-size: 14px; }
        th { background: #f4f4f4; }
        .btn-del { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>एडमिन डैशबोर्ड - ग्राहक ऑर्डर्स</h2>
        <table>
            <thead>
                <tr>
                    <th>ID / दिनांक</th>
                    <th>ग्राहक</th>
                    <th>कार्ड</th>
                    <th>राशि</th>
                    <th>स्टेटस</th>
                    <th>हटाएं</th>
                </tr>
            </thead>
            <tbody id="adminOrdersBody">
                <tr><td colspan="6">लोड हो रहा है...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = "https://qsvhtfkrlzclnqwypfdy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdmh0ZmtybHpjbG5xd3lwZmR5InIscm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDc3NjMsImV4cCI6MjEwMzgyMzc2M30.HLYUjfCK0w9d6C_-uPMFv-eAe6Cd_YkueSo--iHOUys";
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', () => { loadAdminOrders(); });

        async function loadAdminOrders() {
            const tbody = document.getElementById('adminOrdersBody');
            let orders = [];

            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('orders').select('*');
                    if (data) orders = data;
                } catch (e) {}
            }

            if (orders.length === 0) {
                try {
                    orders = JSON.parse(localStorage.getItem('my_orders_list') || '[]');
                } catch (e) {}
            }

            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">कोई ऑर्डर नहीं मिला।</td></tr>';
                return;
            }

            tbody.innerHTML = orders.map(o => `
                <tr>
                    <td>#${o.id}</td>
                    <td><b>${o.customer_name}</b><br>${o.mobile}</td>
                    <td>${o.card_title || 'शादी कार्ड'}</td>
                    <td>कुल: ₹${o.total_amount}<br>एडवांस: ₹${o.advance_paid}</td>
                    <td><b>${o.status || 'Pending'}</b></td>
                    <td><button class="btn-del" onclick="deleteOrder('${o.id}')">हटाएं</button></td>
                </tr>
            `).join('');
        }

        async function deleteOrder(id) {
            if (!confirm("क्या आप वाकई इस ऑर्डर को हटाना चाहते हैं?")) return;

            if (supabaseClient) {
                try {
                    await supabaseClient.from('orders').delete().eq('id', id);
                } catch (e) {}
            }

            try {
                let local = JSON.parse(localStorage.getItem('my_orders_list') || '[]');
                local = local.filter(o => String(o.id) !== String(id));
                localStorage.setItem('my_orders_list', JSON.stringify(local));
            } catch (e) {}

            loadAdminOrders();
        }
    </script>
</body>
</html>
