<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Mukta','Poppins',sans-serif;-webkit-tap-highlight-color:transparent}
:root{--green:#075e54;--green2:#128c7e;--bg:#efeae2;--dark:#0f172a}
html,body{height:100%;background:#dfe5e7}
body{display:flex;flex-direction:column;min-height:100vh}
.chat-app{width:100%;max-width:900px;margin:0 auto;height:100vh;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 35px rgba(0,0,0,.15)}
.chat-head{background:linear-gradient(135deg,#075e54,#128c7e);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.16);z-index:2}
.back-btn{width:38px;height:38px;border:0;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;font-size:18px;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;background:#fff;color:#075e54;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.head-info{min-width:0;flex:1}.head-info b{display:block;font-size:17px;line-height:1.15}.head-info span{display:block;font-size:11px;color:#d9fdd3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.live{font-size:10px;color:#d9fdd3;margin-top:1px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#94a3b8;margin-right:4px}.dot.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
.head-actions{display:flex;gap:6px}.head-btn{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.order-bar{background:#fff;padding:7px 12px;border-bottom:1px solid #d7dadd;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-shrink:0;font-size:11px}
.order-bar .title{font-weight:800;color:#075e54;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.order-bar .status{color:#64748b;white-space:nowrap}
.chat-area{flex:1;overflow-y:auto;padding:14px 10px 12px;scroll-behavior:smooth;background-color:#efeae2;background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:18px 18px}
.date-note{text-align:center;margin:4px auto 12px;background:rgba(255,255,255,.72);color:#64748b;padding:4px 10px;border-radius:10px;width:max-content;max-width:90%;font-size:10px}
.msg{max-width:min(78%,600px);width:fit-content;margin:0 0 8px;padding:7px 9px;border-radius:8px;box-shadow:0 1px 1px rgba(0,0,0,.12);font-size:13px;line-height:1.45;position:relative;word-break:break-word}
.msg.customer{margin-left:auto;background:#d9fdd3;border-top-right-radius:3px}.msg.admin{margin-right:auto;background:#fff;border-top-left-radius:3px}
.msg .who{font-size:10px;font-weight:800;color:#075e54;margin-bottom:2px}.msg .meta{font-size:9px;color:#64748b;text-align:right;margin-top:3px}
.file-card{display:flex;align-items:center;gap:9px;padding:8px;background:rgba(255,255,255,.72);border:1px solid #d7dadd;border-radius:9px;margin-top:4px}.file-icon{font-size:22px;color:#2563eb}.file-card a{color:#075e54;font-weight:800;text-decoration:none;overflow:hidden;text-overflow:ellipsis}.file-size{font-size:9px;color:#64748b}
.preview{display:none;padding:6px 10px;background:#f0f2f5;border-top:1px solid #ddd;align-items:center;gap:8px}.preview audio{width:190px;max-width:60%}.preview button{margin-left:auto;border:0;border-radius:50%;width:28px;height:28px;background:#ef4444;color:#fff}
.typing{display:none;background:#fff;color:#64748b;font-size:10px;padding:4px 12px;border-top:1px solid #e2e8f0}.typing span{animation:blink 1s infinite}@keyframes blink{50%{opacity:.25}}
.compose{background:#f0f2f5;padding:7px 8px 9px;flex-shrink:0;border-top:1px solid #d7dadd}.compose-row{display:flex;align-items:flex-end;gap:6px}.tool-btn{width:42px;height:42px;border:0;border-radius:50%;background:#fff;color:#075e54;cursor:pointer;font-size:17px;flex-shrink:0}.text-wrap{flex:1;background:#fff;border-radius:22px;border:1px solid #d1d7db;display:flex;align-items:flex-end;padding:0 10px}.text-wrap textarea{width:100%;border:0;outline:0;resize:none;max-height:110px;min-height:42px;padding:11px 3px;font-size:13px;background:transparent}.send-btn{width:44px;height:44px;border:0;border-radius:50%;background:#128c7e;color:#fff;cursor:pointer;font-size:17px;flex-shrink:0}.recording{background:#dc2626!important}.file-name{font-size:10px;color:#475569;padding:3px 8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hidden{display:none!important}
.attach-wrap{position:relative;flex-shrink:0}
.attach-menu{display:none;position:absolute;left:0;bottom:49px;width:185px;background:#fff;border:1px solid #d8dee3;border-radius:14px;padding:7px;box-shadow:0 10px 28px rgba(0,0,0,.18);z-index:20}
.attach-menu.show{display:grid;grid-template-columns:1fr;gap:4px}
.attach-menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:#fff;border-radius:10px;padding:10px;text-align:left;font-weight:700;color:#334155;font-size:13px}
.attach-menu button:active,.attach-menu button:hover{background:#f1f5f9}
.attach-menu i{width:22px;text-align:center;color:#075e54;font-size:16px}
@media(max-width:520px){.attach-menu{bottom:46px;width:170px}.attach-menu button{padding:9px;font-size:12px}}
.loading,.error-state{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#64748b}.error-state .box{background:#fff;border-radius:16px;padding:24px;max-width:420px;box-shadow:0 12px 35px rgba(0,0,0,.12)}.error-state h3{color:#0f172a;margin-bottom:8px}.main-btn{border:0;border-radius:22px;padding:9px 18px;background:#128c7e;color:#fff;font-weight:800;cursor:pointer;margin-top:12px}
@media(min-width:901px){body{padding:12px}.chat-app{height:calc(100vh - 24px);border-radius:18px;overflow:hidden}}
@media(max-width:520px){.msg{max-width:88%}.head-info b{font-size:15px}.order-bar{padding:6px 9px}.chat-area{padding:10px 7px}.tool-btn{width:38px;height:38px}.send-btn{width:40px;height:40px}.text-wrap textarea{min-height:38px}}
</style>
</head>
<body>
<div class="chat-app">
  <div class="chat-head">
    <button class="back-btn" id="backBtn" title="वापस"><i class="fa-solid fa-arrow-left"></i></button>
    <div class="avatar"><i class="fa-solid fa-comments"></i></div>
    <div class="head-info">
      <b id="chatTitle">DP Chat</b>
      <span id="chatSubtitle">दिल्ली प्रेस</span>
      <div class="live"><span id="liveDot" class="dot"></span><span id="liveText">कनेक्ट हो रहा है...</span></div>
    </div>
    <div class="head-actions">
      <button class="head-btn" id="refreshBtn" title="रिफ्रेश"><i class="fa-solid fa-rotate"></i></button>
    </div>
  </div>
  <div class="order-bar">
    <div class="title" id="orderTitle">ऑर्डर बातचीत</div>
    <div class="status" id="orderStatus">लोड हो रहा है...</div>
  </div>
  <main class="chat-area" id="chatArea"><div class="loading">बातचीत लोड हो रही है...</div></main>
  <div class="typing" id="typingBar">सामने वाला टाइप कर रहा है <span>● ● ●</span></div>
  <div class="preview" id="voicePreview"><b>वॉयस तैयार है</b><audio id="voiceAudio" controls></audio><button id="cancelVoice">×</button></div>
  <div class="compose">
    <div class="compose-row">
      <div class="attach-wrap">
        <button class="tool-btn" id="fileBtn" title="अटैचमेंट"><i class="fa-solid fa-paperclip"></i></button>
        <div class="attach-menu" id="attachMenu">
          <button type="button" id="galleryBtn"><i class="fa-solid fa-images"></i><span>Gallery</span></button>
          <button type="button" id="documentBtn"><i class="fa-solid fa-file-lines"></i><span>Documents</span></button>
          <button type="button" id="menuCameraBtn"><i class="fa-solid fa-camera"></i><span>Camera</span></button>
        </div>
      </div>
      <input class="hidden" type="file" id="fileInput" accept="image/*,video/*,audio/*">
      <input class="hidden" type="file" id="documentInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.txt,.csv,.ppt,.pptx,.zip,.rar">
      <button class="tool-btn" id="cameraBtn" title="कैमरा"><i class="fa-solid fa-camera"></i></button>
      <input class="hidden" type="file" id="cameraInput" accept="image/*" capture="environment">
      <div class="text-wrap"><textarea id="messageInput" rows="1" placeholder="मैसेज लिखें…" maxlength="5000"></textarea></div>
      <button class="tool-btn" id="micBtn" title="वॉयस रिकॉर्ड करें"><i class="fa-solid fa-microphone"></i></button>
      <button class="send-btn" id="sendBtn" title="भेजें"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
    <div class="file-name" id="fileName"></div>
  </div>
</div>
<script>
const SUPABASE_URL="https://qsvhtfkrlzclnqwypfdy.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdmh0ZmtybHpjbG5xd3lwZmR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDc3NjMsImV4cCI6MjEwMzgyMzc2M30.HLYUjfCK0w9d6C_-uPMFv-eAe6Cd_YkueSo--iHOUys";

<script>
let supabaseClient=null, currentOrder=null, role='customer', orderId=null, channel=null;
let selectedFile=null, voiceRecorder=null, voiceChunks=[], voiceBlob=null, voiceUrl=null, typingTimer=null;
const qs=new URLSearchParams(location.search);
orderId=qs.get('order_id')||qs.get('id')||'';
role=(qs.get('role')||'customer').toLowerCase()==='admin'?'admin':'customer';

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
const arr=v=>{try{const x=typeof v==='string'?JSON.parse(v||'[]'):v;return Array.isArray(x)?x:[]}catch(e){return[]}};
const norm=v=>String(v??'').replace(/\D/g,'').slice(-10);
const currentUser=()=>{try{return JSON.parse(localStorage.getItem('dp_current_user')||localStorage.getItem('dp_logged_in_user')||localStorage.getItem('user')||'{}')}catch(e){return{}}};

function setLive(on,label){$('liveDot').className='dot '+(on?'on':'');$('liveText').textContent=label||(on?'ऑनलाइन':'ऑफलाइन')}
function scrollBottom(){const a=$('chatArea');if(a)setTimeout(()=>a.scrollTop=a.scrollHeight,30)}
function formatTime(v){try{return new Date(v).toLocaleString('hi-IN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return''}}
function fileIcon(name){const n=String(name||'').toLowerCase();if(/\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(n))return'fa-image';if(/\.pdf$/i.test(n))return'fa-file-pdf';if(/\.(mp4|webm|mov|avi)$/i.test(n))return'fa-file-video';if(/\.(doc|docx)$/i.test(n))return'fa-file-word';if(/\.(xls|xlsx)$/i.test(n))return'fa-file-excel';return'fa-file'}
function renderChat(){
  const msgs=[...arr(currentOrder?.customer_messages),...arr(currentOrder?.admin_messages)].map(x=>({...x,_kind:'msg'}));
  const files=[...arr(currentOrder?.customer_files),...arr(currentOrder?.admin_files)].map(x=>({...x,_kind:'file'}));
  const items=[...msgs,...files].sort((a,b)=>new Date(a.at||0)-new Date(b.at||0));
  let lastDay='';
  const html=items.map(x=>{
    const isMe=(role==='admin'&&x.from==='admin')||(role==='customer'&&x.from==='customer');
    const who=x.from==='admin'?'दिल्ली प्रेस':'आप';
    const d=x.at?new Date(x.at).toLocaleDateString('hi-IN'):'';
    let sep='';
    if(d&&d!==lastDay){lastDay=d;sep=`<div class="date-note">${esc(d)}</div>`}
    if(x._kind==='file'){
      if(x.kind==='voice'||String(x.type||x.mime||'').startsWith('audio/')) return sep+`<div class="msg ${isMe?'customer':'admin'}"><div class="who">${who}</div><audio controls preload="metadata" style="max-width:100%;" src="${esc(x.url||'')}"></audio><div class="meta">${formatTime(x.at)}</div></div>`;
      const nm=esc(x.name||'फाइल देखें');
      return sep+`<div class="msg ${isMe?'customer':'admin'}"><div class="who">${who}</div><div class="file-card"><i class="fa-solid ${fileIcon(x.name)} file-icon"></i><div style="min-width:0"><a href="${esc(x.url||'#')}" target="_blank" rel="noopener" download>${nm}</a><div class="file-size">${x.size?Math.round(x.size/1024)+' KB':'फाइल'}</div></div></div><div class="meta">${formatTime(x.at)}</div></div>`;
    }
    return sep+`<div class="msg ${isMe?'customer':'admin'}"><div class="who">${who}</div>${esc(x.text||'')}<div class="meta">${formatTime(x.at)} ${isMe?'✓✓':''}</div></div>`;
  }).join('');
  $('chatArea').innerHTML=html||'<div class="date-note">अभी कोई संदेश नहीं है। नीचे से पहला संदेश भेजें।</div>';scrollBottom();
}
async function loadOrder(){
  if(!supabaseClient)return fail('Supabase कनेक्शन उपलब्ध नहीं है।');
  if(!orderId)return fail('इस चैट के लिए ऑर्डर ID नहीं मिली।');
  if(role==='admin'&&!sessionStorage.getItem('dp_admin_chat_access'))return fail('Admin Chat खोलने के लिए पहले Admin Panel में लॉगिन करें।');
  $('chatArea').innerHTML='<div class="loading"><div><i class="fa-solid fa-spinner fa-spin"></i><br><b>बातचीत लोड हो रही है...</b><br><small>कृपया थोड़ा इंतजार करें</small></div></div>';
  try{
    const req1=supabaseClient.from('orders').select('*').eq('id',orderId).limit(1);
    const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('डेटाबेस से जवाब आने में समय लग रहा है। इंटरनेट/ Supabase कनेक्शन जांचें।')),12000));
    let result=await Promise.race([req1,timeout]);
    let data=result.data||[], error=result.error||null;

    // कुछ पुराने orders में id की जगह order_id URL में इस्तेमाल हुआ हो तो fallback.
    if(!data.length && !error){
      const req2=supabaseClient.from('orders').select('*').eq('order_id',orderId).limit(1);
      result=await Promise.race([req2,timeout]);
      data=result.data||[]; error=result.error||null;
    }
    if(error||!data?.[0])return fail(error?.message||'ऑर्डर नहीं मिला। कृपया My Orders से DP Chat फिर खोलें.');
    const o=data[0];
  if(role==='customer'){
    const u=currentUser(), phone=norm(u.mobile||u.phone||u.mobile_number);
    const op=norm(o.mobile||o.phone||o.mobile_number);
    if(!phone)return fail('कस्टमर लॉगिन नहीं मिला। पहले My Orders में लॉगिन करें।');
    if(!op||phone!==op)return fail('यह ऑर्डर आपके अकाउंट से संबंधित नहीं है।');
  }
  currentOrder=o;
  $('chatTitle').textContent=role==='admin'?'ग्राहक से बातचीत':'दिल्ली प्रेस';
  $('chatSubtitle').textContent=`${o.customer_name||o.name||'ग्राहक'} • ${o.mobile||o.phone||''}`;
  $('orderTitle').textContent=`#${o.order_id||o.id} • ${o.card_title||o.card_name||'ऑर्डर'}`;
  $('orderStatus').textContent=o.status||'Pending';
  setLive(false,'ऑफलाइन');
  renderChat();subscribeRealtime();
  }catch(e){
    fail(e?.message||'बातचीत लोड नहीं हो सकी। कृपया Refresh दबाएँ।');
  }
}
function fail(msg){$('chatArea').innerHTML=`<div class="error-state"><div class="box"><h3><i class="fa-solid fa-circle-exclamation"></i> DP Chat</h3><p>${esc(msg)}</p><button class="main-btn" onclick="history.back()">वापस जाएँ</button></div></div>`;$('orderStatus').textContent='';setLive(false,'उपलब्ध नहीं')}
function subscribeRealtime(){
  if(!supabaseClient||!currentOrder?.id)return;
  if(channel)try{supabaseClient.removeChannel(channel)}catch(e){}
  channel=supabaseClient.channel('dp-chat-'+currentOrder.id,{config:{broadcast:{self:false},presence:{key:role}}})
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'orders',filter:`id=eq.${currentOrder.id}`},p=>{
      if(p.new){currentOrder={...currentOrder,...p.new};$('orderStatus').textContent=currentOrder.status||'Pending';renderChat()}
    })
    .on('broadcast',{event:'typing'},p=>{
      const other=p.payload?.from!==role&&p.payload?.typing;
      $('typingBar').style.display=other?'block':'none';if(other){clearTimeout(window.__typingHide);window.__typingHide=setTimeout(()=>$('typingBar').style.display='none',1800)}
    })
    .on('presence',{event:'sync'},()=>setPresence())
    .on('presence',{event:'join'},()=>setPresence())
    .on('presence',{event:'leave'},()=>setPresence())
    .subscribe(async status=>{if(status==='SUBSCRIBED'){try{await channel.track({role,online_at:new Date().toISOString()})}catch(e){};setLive(true,'ऑनलाइन')}})
}
function setPresence(){if(!channel)return;try{const st=channel.presenceState();const other=Object.values(st).flat().some(x=>x&&x.role!==role);setLive(other,other?'सामने वाला ऑनलाइन':'आप ऑनलाइन')}catch(e){}}
function typeSignal(){
  if(!channel)return;clearTimeout(typingTimer);
  channel.send({type:'broadcast',event:'typing',payload:{from:role,typing:true}}).catch(()=>{});
  typingTimer=setTimeout(()=>channel&&channel.send({type:'broadcast',event:'typing',payload:{from:role,typing:false}}).catch(()=>{}),1200);
}
async function uploadFile(file){
  if(!file)throw new Error('फाइल नहीं मिली।');
  if(file.size>20*1024*1024)throw new Error('फाइल 20 MB से छोटी रखें।');
  const ext=(file.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').toLowerCase()||'bin';
  const path=`${currentOrder.id}/${role}_${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
  const {error}=await supabaseClient.storage.from('order-corrections').upload(path,file,{upsert:false,contentType:file.type||undefined});
  if(error)throw new Error('फाइल अपलोड नहीं हुई: '+error.message);
  const {data}=supabaseClient.storage.from('order-corrections').getPublicUrl(path);
  return {name:file.name,url:data.publicUrl,path,from:role,at:new Date().toISOString(),size:file.size,type:file.type||''};
}
async function sendMessage(){
  if(!currentOrder)return;
  const text=$('messageInput').value.trim();
  const file=selectedFile;
  const voice=voiceBlob;
  if(!text&&!file&&!voice){$('messageInput').focus();return}
  $('sendBtn').disabled=true;
  try{
    const fresh=await supabaseClient.from('orders').select('*').eq('id',currentOrder.id).limit(1);
    if(fresh.data?.[0])currentOrder=fresh.data[0];
    const msgKey=role==='admin'?'admin_messages':'customer_messages';
    const fileKey=role==='admin'?'admin_files':'customer_files';
    const msgs=arr(currentOrder[msgKey]), files=arr(currentOrder[fileKey]);
    if(text)msgs.push({from:role,text,at:new Date().toISOString()});
    if(file)files.push(await uploadFile(file));
    if(voice){
      const vf=await uploadFile(new File([voice],'वॉयस संदेश.'+(voice.type.includes('mp4')?'m4a':'webm'),{type:voice.type||'audio/webm'}));
      vf.kind='voice';files.push(vf);
    }
    const payload={};payload[msgKey]=msgs;payload[fileKey]=files;
    const {data,error}=await supabaseClient.from('orders').update(payload).eq('id',currentOrder.id).select().single();
    if(error)throw error;
    currentOrder=data;renderChat();clearComposer();
  }catch(e){alert(e.message||'मैसेज भेजने में समस्या हुई।')}finally{$('sendBtn').disabled=false}
}
function clearComposer(){
  $('messageInput').value='';selectedFile=null;$('fileInput').value='';$('cameraInput').value='';$('fileName').textContent='';
  voiceBlob=null;if(voiceUrl){URL.revokeObjectURL(voiceUrl);voiceUrl=null}$('voicePreview').style.display='none';$('voiceAudio').removeAttribute('src');
}
function chooseFile(f){selectedFile=f||null;$('fileName').textContent=f?'📎 '+f.name:''}
async function toggleVoice(){
  if(voiceRecorder?.state==='recording'){voiceRecorder.stop();$('micBtn').classList.remove('recording');$('micBtn').innerHTML='<i class="fa-solid fa-microphone"></i>';return}
  if(!navigator.mediaDevices?.getUserMedia)return alert('इस ब्राउज़र में माइक्रोफोन उपलब्ध नहीं है।');
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(x=>MediaRecorder.isTypeSupported(x))||'';
    voiceRecorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);voiceChunks=[];voiceBlob=null;
    voiceRecorder.ondataavailable=e=>{if(e.data?.size)voiceChunks.push(e.data)};
    voiceRecorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());voiceBlob=new Blob(voiceChunks,{type:voiceRecorder.mimeType||'audio/webm'});if(voiceUrl)URL.revokeObjectURL(voiceUrl);voiceUrl=URL.createObjectURL(voiceBlob);$('voiceAudio').src=voiceUrl;$('voicePreview').style.display='flex'};
    voiceRecorder.start();$('micBtn').classList.add('recording');$('micBtn').innerHTML='<i class="fa-solid fa-stop"></i>';
  }catch(e){alert('माइक्रोफोन की अनुमति नहीं मिली।')}
}
$('sendBtn').onclick=sendMessage;
$('messageInput').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px';typeSignal()});
$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
$('fileBtn').onclick=e=>{e.stopPropagation();$('attachMenu').classList.toggle('show')};
$('galleryBtn').onclick=()=>{$('attachMenu').classList.remove('show');$('fileInput').click()};
$('documentBtn').onclick=()=>{$('attachMenu').classList.remove('show');$('documentInput').click()};
$('menuCameraBtn').onclick=()=>{$('attachMenu').classList.remove('show');$('cameraInput').click()};
$('cameraBtn').onclick=()=>$('cameraInput').click();
$('micBtn').onclick=toggleVoice;
$('fileInput').onchange=e=>chooseFile(e.target.files[0]);
$('documentInput').onchange=e=>chooseFile(e.target.files[0]);
$('cameraInput').onchange=e=>chooseFile(e.target.files[0]);
document.addEventListener('click',e=>{if(!e.target.closest('.attach-wrap'))$('attachMenu')?.classList.remove('show')});
$('cancelVoice').onclick=()=>{voiceBlob=null;if(voiceUrl){URL.revokeObjectURL(voiceUrl);voiceUrl=null}$('voicePreview').style.display='none';$('voiceAudio').removeAttribute('src')};
$('refreshBtn').onclick=loadOrder;
$('backBtn').onclick=()=>history.length>1?history.back():(location.href=role==='admin'?'admin.html':'my_orders.html');
window.addEventListener('beforeunload',()=>{if(channel&&supabaseClient)try{supabaseClient.removeChannel(channel)}catch(e){}});
try{supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){fail('Supabase कनेक्शन नहीं बन पाया।')}
window.addEventListener('error',e=>{
  if($('chatArea')?.querySelector('.loading')) fail('DP Chat में तकनीकी समस्या हुई। कृपया Refresh दबाएँ।');
});
loadOrder();
</script>
