<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भुगतान - दिल्ली प्रेस</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0d1322; color: #1e293b; font-family: 'Mukta', sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 25px; border-radius: 12px; }
        .btn { width: 100%; padding: 14px; background: #10b981; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>भुगतान कन्फर्मेशन</h2>
        <p>कुल राशि: <b id="lblTotal">₹0</b></p>
        <p>एडवांस: <b id="lblAdvance">₹0</b></p>
        <button class="btn" onclick="finalizeAndSubmitOrder()">ऑर्डर सबमिट करें</button>
    </div>

    <script>
        const SUPABASE_URL = "https://qsvhtfkrlzclnqwypfdy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdmh0ZmtybHpjbG5xd3lwZmR5InIscm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDc3NjMsImV4cCI6MjEwMzgyMzc2M30.HLYUjfCK0w9d6C_-uPMFv-eAe6Cd_YkueSo--iHOUys";
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let pendingOrderData = null;

        window.addEventListener('DOMContentLoaded', () => {
            const temp = localStorage.getItem('dp_temp_order');
            if (!temp) { window.location.href = "order.html"; return; }
            pendingOrderData = JSON.parse(temp);
            document.getElementById('lblTotal').innerText = `₹${pendingOrderData.total_amount || 0}`;
            document.getElementById('lblAdvance').innerText = `₹${pendingOrderData.advance_paid || 0}`;
        });

        async function finalizeAndSubmitOrder() {
            if (!pendingOrderData) return;

            if (supabaseClient) {
                try {
                    await supabaseClient.from('orders').insert([pendingOrderData]);
                } catch (e) {
                    console.error("DB insert error:", e);
                }
            }

            try {
                let localOrders = JSON.parse(localStorage.getItem('my_orders_list') || localStorage.getItem('dp_all_orders') || '[]');
                localOrders.unshift(pendingOrderData);
                localStorage.setItem('my_orders_list', JSON.stringify(localOrders));
                localStorage.setItem('dp_all_orders', JSON.stringify(localOrders));
                localStorage.removeItem('dp_temp_order');
            } catch (e) {}

            alert("ऑर्डर सफलतापूर्वक सबमिट हो गया है!");
            window.location.href = "my_orders.html";
        }
    </script>
</body>
</html>
