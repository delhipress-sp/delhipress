<html lang="hi">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #e63946;
            --primary-gradient: linear-gradient(135deg, #e63946 0%, #d62828 100%);
            --secondary: #f77f00;
            --dark: #0f172a;
            --green: #10b981;
            --blue: #2563eb;
            --glass-bg: rgba(255, 255, 255, 0.94);
            --glass-border: rgba(255, 255, 255, 0.6);
            --card-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 25px rgba(230, 57, 70, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #0d1322;
            background-image: 
                radial-gradient(at 0% 0%, rgba(230, 57, 70, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(37, 99, 235, 0.18) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(247, 127, 0, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.12) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: #1e293b;
            line-height: 1.5;
            padding-bottom: 80px;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 18px;
        }
        .nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .nav-logo-box {
            width: 42px; height: 42px; border-radius: 50%;
            border: 2px solid var(--primary); display: flex;
            align-items: center; justify-content: center; overflow: hidden;
            background: #fff; box-shadow: 0 0 12px rgba(230, 57, 70, 0.4);
        }
        .nav-brand h2 { color: #ffffff; font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
        .nav-actions { display: flex; align-items: center; gap: 10px; }

        .btn-nav {
            text-decoration: none; color: #f8fafc; font-weight: 700; font-size: 13px;
            padding: 7px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08); display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-logout-nav { background: #ef4444; border-color: #f87171; color: white !important; cursor: pointer; }

        .container { max-width: 850px; margin: 20px auto; padding: 0 14px; }

        .user-welcome-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 16px 20px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
            box-shadow: var(--card-shadow);
        }
        .user-info h3 { font-size: 18px; color: var(--dark); font-weight: 800; }
        .user-info p { font-size: 13px; color: #64748b; font-weight: 600; }

        .section-bar-title {
            font-size: 18px; color: #ffffff; margin: 0; font-weight: 800;
            display: flex; align-items: center; gap: 8px;
        }

        .btn-refresh {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff; padding: 6px 12px; border-radius: 20px; font-size: 12px;
            cursor: pointer; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
        }

        .order-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px; margin-bottom: 18px; padding: 18px;
            box-shadow: var(--card-shadow);
        }

        .order-card-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px dashed #cbd5e1; padding-bottom: 12px; margin-bottom: 14px;
            flex-wrap: wrap; gap: 10px;
        }
        .order-id-date { display: flex; align-items: center; gap: 12px; }
        .order-card-img {
            width: 58px; height: 58px; object-fit: cover; border-radius: 10px; border: 1px solid #cbd5e1;
            background: #f1f5f9; flex-shrink: 0;
        }
        .order-id-date h4 { font-size: 16px; color: var(--primary); margin: 0; font-weight: 800; }
        .order-id-date span { font-size: 12px; color: #64748b; font-weight: 600; }

        .badge-status {
            padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 800;
            display: inline-flex; align-items: center; gap: 6px;
        }

        .order-details-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px; font-size: 13px; margin-bottom: 14px;
        }
        .detail-item { background: #ffffff; padding: 10px 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .detail-item b { color: #64748b; display: block; font-size: 11px; font-weight: 700; margin-bottom: 2px; }

        .couples-summary {
            background: #ffffff; border-left: 4px solid var(--secondary);
            padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 14px;
        }

        .order-card-footer {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid #f1f5f9; padding-top: 12px; flex-wrap: wrap; gap: 10px;
        }
        .balance-info { font-size: 13px; font-weight: 600; color: #475569; }
        .balance-info b { color: #b91c1c; font-size: 15px; }

        .footer-action-buttons {
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
        }

        .btn-view-receipt {
            background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 8px 14px;
            font-size: 12px; font-weight: 800; border-radius: 20px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px;
        }

        .btn-cancel-order {
            background: #ef4444; color: white; border: none; padding: 8px 14px;
            font-size: 12px; font-weight: 800; border-radius: 20px; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .btn-cancel-order:hover { background: #dc2626; }

        .empty-orders {
            background: var(--glass-bg); border: 2px dashed #cbd5e1; border-radius: 16px;
            padding: 45px 20px; text-align: center; color: #64748b;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(6px); display: none; justify-content: center;
            align-items: center; z-index: 9999; padding: 15px;
        }
        .modal-content {
            background: white; width: 100%; max-width: 650px; max-height: 90vh;
            border-radius: 14px; overflow-y: auto; padding: 22px; position: relative;
        }
        .receipt-container { border: 2px dashed #cbd5e1; padding: 20px; border-radius: 8px; background: #fff; }
        .receipt-header { text-align: center; border-bottom: 2px solid #1e293b; padding-bottom: 10px; margin-bottom: 14px; }
        .receipt-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; border-bottom: 1px dotted #e2e8f0; padding-bottom: 4px; }
        .receipt-section-title { background: #f8fafc; padding: 5px 10px; font-weight: 800; color: var(--primary); margin: 12px 0 8px 0; border-left: 3px solid var(--primary); font-size: 13px; }
        .card-preview-box { display: flex; gap: 15px; align-items: center; background: #fafafa; border: 1px solid #e2e8f0; padding: 12px; border-radius: 8px; margin-top: 6px; }
        .card-preview-box img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #cbd5e1; background: #e2e8f0; flex-shrink: 0; }

        .mobile-bottom-bar {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(14px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 0; z-index: 1001; justify-content: space-around;
        }
        .mobile-bottom-bar a {
            background: none; border: none; color: #cbd5e1; text-decoration: none;
            text-align: center; font-size: 11px; font-weight: 600;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
        }
        .mobile-bottom-bar a i { font-size: 18px; color: var(--primary); }

        @media (max-width: 768px) {
            .mobile-bottom-bar { display: flex; }
        }
    </style>
</head>

    <script>
        const SUPABASE_URL = "https://qsvhtfkrlzclnqwypfdy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdmh0ZmtybHpjbG5xd3lwZmR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDc3NjMsImV4cCI6MjEwMzgyMzc2M30.HLYUjfCK0w9d6C_-uPMFv-eAe6Cd_YkueSo--iHOUys";
        
        let supabaseClient = null;
        try {
            if (window.supabase) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {}

        let fetchedOrdersList = [];
        const safeCardPlaceholder = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><rect width='80' height='80' fill='%23f1f5f9'/><text x='50%' y='50%' font-size='11' fill='%2394a3b8' text-anchor='middle' dominant-baseline='middle'>Card</text></svg>";

        window.addEventListener('DOMContentLoaded', () => {
            loadInitialLocalOrders();
            syncWithCloudFast();
        });

        function loadInitialLocalOrders() {
            let localList = [];
            const keys = ['my_orders_list', 'dp_all_orders', 'user_orders', 'dp_my_orders'];
            for (const k of keys) {
                try {
                    const data = JSON.parse(localStorage.getItem(k) || '[]');
                    if (Array.isArray(data) && data.length > 0) {
                        localList = data;
                        break;
                    }
                } catch(e) {}
            }

            if (localList.length === 0) {
                try {
                    const latest = JSON.parse(localStorage.getItem('dp_latest_confirmed_order') || 'null');
                    if (latest) localList = [latest];
                } catch(e) {}
            }

            if (localList.length > 0) {
                fetchedOrdersList = localList;
                renderOrdersUI();
            }
            updateUserGreeting();
        }

        function updateUserGreeting() {
            let userObj = null;
            try {
                userObj = JSON.parse(localStorage.getItem('dp_current_user') || localStorage.getItem('dp_logged_in_user') || '{}');
            } catch(e) {}

            const nameEl = document.getElementById('userDisplayName');
            const phoneEl = document.getElementById('userDisplayPhone');

            if (userObj && (userObj.name || userObj.phone || userObj.mobile)) {
                if (nameEl) nameEl.innerText = userObj.name || "सम्मानित ग्राहक";
                if (phoneEl) phoneEl.innerText = userObj.phone || userObj.mobile || "";
            } else if (fetchedOrdersList.length > 0) {
                const ord = fetchedOrdersList[0];
                if (nameEl) nameEl.innerText = ord.customer_name || "सम्मानित ग्राहक";
                if (phoneEl) phoneEl.innerText = ord.mobile || ord.phone || "";
            } else {
                if (nameEl) nameEl.innerText = "सम्मानित ग्राहक";
                if (phoneEl) phoneEl.innerText = "दिल्ली प्रेस में आपका स्वागत है";
            }
        }

        async function syncWithCloudFast() {
            let userObj = null;
            try {
                userObj = JSON.parse(localStorage.getItem('dp_current_user') || localStorage.getItem('dp_logged_in_user') || '{}');
            } catch(e) {}

            let phone = userObj ? (userObj.phone || userObj.mobile) : null;
            if (!phone && fetchedOrdersList.length > 0) {
                phone = fetchedOrdersList[0].mobile || fetchedOrdersList[0].phone;
            }

            if (!supabaseClient) return;

            try {
                let query = supabaseClient.from('orders').select('*').order('id', { ascending: false }).limit(25);
                if (phone) {
                    query = query.or(`mobile.eq.${phone},phone.eq.${phone}`);
                }

                const { data, error } = await query;
                if (!error && data && data.length > 0) {
                    fetchedOrdersList = data;
                    localStorage.setItem('my_orders_list', JSON.stringify(data));
                    renderOrdersUI();
                } else if (fetchedOrdersList.length === 0) {
                    renderOrdersUI();
                }
            } catch(e) {
                renderOrdersUI();
            }
        }

        function fetchCustomerOrders() {
            syncWithCloudFast();
        }

        function getStatusBadge(status) {
            const s = (status || 'Pending').trim().toLowerCase();
            if (s === 'received' || s === 'स्वीकार किया गया') {
                return `<span class="badge-status" style="background:#e0e7ff; color:#3730a3; border:1px solid #c7d2fe;"><i class="fa-solid fa-handshake"></i> स्वीकार किया गया</span>`;
            } else if (s === 'designing' || s === 'matter typing' || s.includes('डिजाइन')) {
                return `<span class="badge-status" style="background:#f3e8ff; color:#6b21a8; border:1px solid #e9d5ff;"><i class="fa-solid fa-palette"></i> मैटर डिजाइन जारी है</span>`;
            } else if (s === 'printing' || s === 'processing' || s.includes('छपाई')) {
                return `<span class="badge-status" style="background:#fef3c7; color:#92400e; border:1px solid #fde68a;"><i class="fa-solid fa-print"></i> छपाई जारी है (Printing)</span>`;
            } else if (s === 'ready' || s === 'तैयार') {
                return `<span class="badge-status" style="background:#dcfce7; color:#15803d; border:1px solid #bbf7d0;"><i class="fa-solid fa-circle-check"></i> कार्ड तैयार है (Ready)</span>`;
            } else if (s === 'delivered') {
                return `<span class="badge-status" style="background:#d1fae5; color:#065f46; border:1px solid #6ee7b7;"><i class="fa-solid fa-box"></i> डिलीवर हो चुका है</span>`;
            } else if (s === 'cancelled' || s === 'रद्द') {
                return `<span class="badge-status" style="background:#fee2e2; color:#991b1b; border:1px solid #fca5a5;"><i class="fa-solid fa-ban"></i> ऑर्डर रद्द (Cancelled)</span>`;
            } else {
                return `<span class="badge-status" style="background:#fff7ed; color:#c2410c; border:1px solid #fed7aa;"><i class="fa-solid fa-clock"></i> प्रक्रिया में (Pending)</span>`;
            }
        }

        /* CUSTOMER ORDER CANCEL FUNCTION */
        async function cancelCustomerOrder(orderIdentifier, index) {
            if (!confirm("क्या आप वाकई इस ऑर्डर को रद्द (Cancel) करना चाहते हैं?")) return;

            const order = fetchedOrdersList[index];
            if (!order) return;

            // Update state locally
            order.status = 'Cancelled';
            renderOrdersUI();
