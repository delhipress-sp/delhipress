<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>मेरे ऑर्डर्स - दिल्ली प्रेस</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0d1322; color: #fff; font-family: 'Mukta', sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .order-card { background: #fff; color: #333; padding: 16px; border-radius: 10px; margin-bottom: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>आपके ऑर्डर्स</h2>
        <div id="ordersContainer">लोड हो रहा है...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://qsvhtfkrlzclnqwypfdy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdmh0ZmtybHpjbG5xd3lwZmR5InIscm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNDc3NjMsImV4cCI6MjEwMzgyMzc2M30.HLYUjfCK0w9d6C_-uPMFv-eAe6Cd_YkueSo--iHOUys";
        let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('ordersContainer');
            let orders = [];

            if (supabaseClient) {
                try {
                    const { data } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false });
                    if (data) orders = data;
                } catch (e) {}
            }

            if (orders.length === 0) {
                try {
                    orders = JSON.parse(localStorage.getItem('my_orders_list') || '[]');
                } catch (e) {}
            }

            if (orders.length === 0) {
                container.innerHTML = "<p>कोई ऑर्डर नहीं मिला।</p>";
                return;
            }

            container.innerHTML = orders.map(o => `
                <div class="order-card">
                    <h3>${o.card_title || 'शादी कार्ड'} (ID: #${o.id})</h3>
                    <p>ग्राहक: <b>${o.customer_name}</b> | मोबाइल: ${o.mobile}</p>
                    <p>वर: ${o.groom_name} | वधू: ${o.bride_name}</p>
                    <p>कुल: ₹${o.total_amount} | एडवांस: ₹${o.advance_paid} | स्टेटस: <b>${o.status || 'Pending'}</b></p>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
