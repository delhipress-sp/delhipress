<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मेरे ऑर्डर्स - दिल्ली प्रेस</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      padding: 20px 12px;
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
    }
    .header-box {
      text-align: center;
      margin-bottom: 24px;
      padding: 16px;
      background: rgba(30, 41, 59, 0.7);
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .header-box h1 {
      font-size: 22px;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .search-card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .search-card label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
      color: #cbd5e1;
    }
    .search-form {
      display: flex;
      gap: 10px;
    }
    .search-form input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-form input:focus {
      border-color: #38bdf8;
    }
    .btn-search {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-search:hover {
      background: #0369a1;
    }
    .order-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }
    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .order-id {
      font-size: 12px;
      color: #94a3b8;
    }
    .badge-status {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: #0369a1;
      color: #e0f2fe;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .detail-label {
      color: #94a3b8;
    }
    .detail-val {
      font-weight: 500;
      color: #f1f5f9;
      text-align: right;
    }
    .matter-box {
      margin-top: 14px;
      padding: 12px;
      background: #052e16;
      border: 1px solid #15803d;
      border-radius: 8px;
      text-align: center;
    }
    .btn-view-matter {
      display: inline-block;
      margin-top: 6px;
      background: #16a34a;
      color: #ffffff;
      padding: 7px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
    }
    .correction-box {
      margin-top: 14px;
      padding: 14px;
      background: #2a1b12;
      border: 1px solid #9a3412;
      border-radius: 8px;
    }
    .correction-box textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      font-size: 12px;
      resize: vertical;
      margin: 8px 0;
      outline: none;
    }
    .correction-box textarea:focus {
      border-color: #ea580c;
    }
    .correction-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .correction-actions input[type="file"] {
      font-size: 12px;
      color: #cbd5e1;
      flex: 1;
    }
    .btn-send-correction {
      background: #ea580c;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .submitted-correction {
      margin-top: 10px;
      font-size: 11px;
      background: rgba(0,0,0,0.25);
      padding: 8px;
      border-radius: 6px;
      border-left: 3px solid #f97316;
    }
    .empty-state {
      text-align: center;
      padding: 30px 10px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-box">
      <h1>दिल्ली प्रेस - ग्राहक ऑर्डर स्थिति</h1>
      <p style="font-size: 12px; color: #94a3b8;">अपने ऑर्डर का प्रूफ़ देखें और सुधार दर्ज करें</p>
    </div>

    <!-- सर्च फ़ॉर्म -->
    <div class="search-card">
      <label for="custMobile">अपना मोबाइल नंबर दर्ज करें:</label>
      <div class="search-form">
        <input type="tel" id="custMobile" placeholder="उदा. 9876543210" maxlength="10">
        <button class="btn-search" onclick="fetchOrders()">खोजें</button>
      </div>
    </div>

    <!-- ऑर्डर्स लिस्ट कंटेनर -->
    <div id="ordersContainer"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://qsvhtfkrlzclnqwypfdy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzdmh0ZmtybHpjbG5xd3lwZmR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc0NDM0OTEsImV4cCI6MjA3MzAxOTQ5MX0.51iwic9sZS16InFzYmI0ZiCiLp/PXQIOjE3ODgyNDczNjN0InV4cCI6IjEwMDygNDC3NjNsIV4cCI6IjEwMDygYwRcZ2030.HLYUjfCKOw9d6C_-uPMFv-eAe6Cd_YkueSo--iHOUys";

    let supabaseClient = null;
    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.error("Supabase Init Error:", e);
    }

    async function fetchOrders() {
      const mobileInput = document.getElementById('custMobile').value.trim();
      const container = document.getElementById('ordersContainer');

      if (!mobileInput || mobileInput.length < 10) {
        alert("कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें।");
        return;
      }

      if (!supabaseClient) {
        alert("डेटाबेस से कनेक्ट नहीं हो सका!");
        return;
      }

      container.innerHTML = '<div class="empty-state">ऑर्डर लोड हो रहे हैं, कृपया प्रतीक्षा करें...</div>';

      try {
        const { data, error } = await supabaseClient
          .from('orders')
          .select('*')
          .ilike('customer_phone', `%${mobileInput}%`)
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="empty-state">इस नंबर से कोई ऑर्डर नहीं मिला।</div>';
          return;
        }

        renderOrders(data);
      } catch (err) {
        container.innerHTML = `<div class="empty-state" style="color: #ef4444;">डेटा लोड करने में त्रुटि: ${err.message}</div>`;
      }
    }

    function renderOrders(orders) {
      const container = document.getElementById('ordersContainer');
      let html = '';

      orders.forEach(order => {
        const dateStr = order.created_at ? new Date(order.created_at).toLocaleDateString('hi-IN') : 'N/A';
        const totalAmt = order.total_amount || 0;
        const advAmt = order.advance_amount || 0;

        html += `
          <div class="order-card">
            <div class="order-header">
              <span class="order-id">ऑर्डर: #${order.id ? String(order.id).slice(0, 8) : ''} | दिनांक: ${dateStr}</span>
              <span class="badge-status">${order.status || 'Processing'}</span>
            </div>

            <div class="detail-row">
              <span class="detail-label">ग्राहक नाम:</span>
              <span class="detail-val">${order.customer_name || 'N/A'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">वर एवं वधू:</span>
              <span class="detail-val">वर: ${order.groom_name || 'N/A'} | वधू: ${order.bride_name || 'N/A'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">कार्ड मॉडल:</span>
              <span class="detail-val">${order.card_name || 'N/A'}</span>
            </div>
            <div class="detail-row">
              <span class="detail-label">बिल विवरण:</span>
              <span class="detail-val">कुल: ₹${totalAmt} | जमा: ₹${advAmt}</span>
            </div>

            <!-- एडमिन का मैटर डिस्प्ले -->
            ${order.order_matter ? `
              <div class="matter-box">
                <div style="font-size: 13px; font-weight: 600; color: #86efac;">
                  📄 प्रेस द्वारा कार्ड मैटर (प्रूफ़) तैयार है:
                </div>
                <a href="${order.order_matter}" target="_blank" download class="btn-view-matter">
                  मैटर देखें / डाउनलोड करें
                </a>
              </div>
            ` : `
              <div style="margin-top: 10px; font-size: 12px; color: #94a3b8; text-align: center;">
                (प्रेस द्वारा मैटर तैयार होने पर यहाँ प्रूफ़ दिखाई देगा)
              </div>
            `}

            <!-- कस्टमर सुधार फॉर्म -->
            <div class="correction-box">
              <div style="font-weight: 600; color: #fdba74; font-size: 13px;">
                ✏️ मैटर में सुधार / नया बदलाव भेजें:
              </div>
              
              <textarea id="correction_text_${order.id}" rows="2" placeholder="कार्ड मैटर में जो भी बदलाव करवाना हो, यहाँ लिखें..."></textarea>
              
              <div class="correction-actions">
                <input type="file" id="correction_file_${order.id}" accept="image/*,.pdf">
                <button class="btn-send-correction" onclick="submitCorrection('${order.id}')">
                  सुधार भेजें
                </button>
              </div>

              ${order.customer_correction ? `
                <div class="submitted-correction">
                  <strong style="color: #fed7aa;">पिछला भेजा गया सुधार:</strong><br>
                  ${order.customer_correction}
                  ${order.customer_correction_file ? `<br><a href="${order.customer_correction_file}" target="_blank" style="color: #38bdf8; text-decoration: underline; margin-top: 4px; display: inline-block;">संलग्न सुधार फ़ाइल देखें</a>` : ''}
                </div>
              ` : ''}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    async function submitCorrection(orderId) {
      const textVal = document.getElementById(`correction_text_${orderId}`).value.trim();
      const fileInput = document.getElementById(`correction_file_${orderId}`);
      const file = fileInput.files[0];

      if (!textVal && !file) {
        alert("कृपया सुधार का विवरण लिखें या सुधार फ़ाइल चुनें!");
        return;
      }

      if (!supabaseClient) {
        alert("डेटाबेस से कनेक्ट नहीं हो सका!");
        return;
      }

      const btn = event.target;
      btn.disabled = true;
      btn.innerText = "भेजा जा रहा है...";

      try {
        let uploadedUrl = null;

        if (file) {
          const cleanName = file.name.replace(/[^a-zA-Z0-9.]/g, "_");
          const filePath = `corrections/${orderId}_${Date.now()}_${cleanName}`;

          const { error: uploadError } = await supabaseClient.storage
            .from('card-images')
            .upload(filePath, file);

          if (uploadError) throw uploadError;

          const { data: urlData } = supabaseClient.storage
            .from('card-images')
            .getPublicUrl(filePath);

          uploadedUrl = urlData.publicUrl;
        }

        const updateData = {};
        if (textVal) updateData.customer_correction = textVal;
        if (uploadedUrl) updateData.customer_correction_file = uploadedUrl;

        const { error: updateError } = await supabaseClient
          .from('orders')
          .update(updateData)
          .eq('id', orderId);

        if (updateError) throw updateError;

        alert("सुधार सफलतापूर्वक भेज दिया गया है!");
        fetchOrders(); // लिस्ट रीफ्रेश करें
      } catch (err) {
        alert("त्रुटि: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "सुधार भेजें";
      }
    }
  </script>
</body>
</html>
